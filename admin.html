<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<title>Painel da loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F1F3EF;--ink:#0F3D3E;--ink2:#1D5557;--muted:#586C6A;--line:#D5DCD7;--ticket:#F5B83D;--mint:#D3E8DF;--alert:#C0392B;--good:#1B7F5A;color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.15}
  h1{font-size:clamp(1.55rem,3vw,2.1rem)}
  h2{font-size:1.2rem}
  h3{font-size:1rem}
  p{margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--ink2);outline-offset:2px}
  .rail :focus-visible{outline-color:var(--ticket)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none}
  .btn:hover{background:var(--ink2)}
  .btn.ticket{background:var(--ticket);color:var(--ink)}
  .btn.ticket:hover{background:#E8A92B}
  .btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
  .btn.line:hover{background:var(--mint)}
  .btn.small{padding:7px 13px;min-height:36px;font-size:.92rem}
  .btn:disabled{opacity:.55;cursor:default}
  .linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}

  label{display:block;font-size:.86rem;color:var(--muted);margin:14px 0 5px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-height:44px}
  textarea{min-height:120px;resize:vertical;line-height:1.5}
  input[type=color]{width:100%;height:44px;padding:4px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--ink)}
  .check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:1rem;margin:16px 0 4px}
  .check input{width:20px;height:20px;margin-top:2px;flex:none}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .err{color:var(--alert);margin-top:12px;min-height:1.2em}
  .note{color:var(--muted)}

  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;padding:2px 10px 24px}
  .brand svg{transform:rotate(-8deg);flex:none}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:none;color:#BFD6D1;font-weight:500;cursor:pointer;text-align:left}
  .nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button[aria-current=page]{background:var(--ticket);color:var(--ink);font-weight:700}
  .rail .foot{margin-top:auto;padding:10px;font-size:.85rem;color:#9FBDB7;overflow-wrap:anywhere}
  .rail .foot .linkbtn{margin-top:6px;color:#fff}

  main{padding:30px clamp(16px,4vw,48px) 72px;max-width:1100px;width:100%}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .head p{margin-top:5px;color:var(--muted)}
  .back{margin-bottom:14px}

  .band{background:var(--ink);color:#fff;border-radius:22px;padding:26px clamp(18px,3vw,34px) 28px}
  .band h2{font-size:clamp(1.8rem,4.4vw,2.8rem);font-weight:800;letter-spacing:-.025em;font-variation-settings:'wdth' 85}
  .band p{margin-top:6px;color:#BFD6D1;max-width:52ch}
  .marks{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .mark{--r:0deg;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ticket);display:grid;place-items:center;color:var(--ticket);flex:none;transform:rotate(var(--r))}
  .mark svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .mark.more{border-style:dashed;font-weight:700;font-size:.9rem;width:auto;padding:0 13px;border-radius:19px}
  .play .mark{animation:stamp .38s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i) * 38ms)}
  @keyframes stamp{from{opacity:0;transform:scale(.35) rotate(var(--r))}}
  @media (prefers-reduced-motion:reduce){.play .mark{animation:none}}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border-top:1.5px solid var(--ink)}
  .strip>div{padding:14px 16px 4px 0}
  .strip>div+div{padding-left:16px;border-left:1px solid var(--line)}
  .strip b{display:block;font-size:clamp(1.7rem,3vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .strip span{color:var(--muted);font-size:.9rem}
  .strip em{font-style:normal;font-size:.82rem;font-weight:700;margin-left:8px}
  .up{color:var(--good)} .down{color:var(--alert)}

  .sec{margin-top:38px}
  .sec>header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .tools{display:flex;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:#E1E7E3;border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  #chart{width:100%;min-height:240px}
  #chart svg{display:block;max-width:100%}

  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin-bottom:6px}
  .bar i{display:block;height:100%}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .row .t b{display:flex;align-items:center;font-weight:600}
  .row .t small{display:block;color:var(--muted);font-size:.88rem;margin-left:18px}
  .row .n{font-size:1.35rem;font-weight:700}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px}
  .chip small{color:var(--muted);margin-left:4px;font-weight:500}
  .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[aria-pressed=true] small{color:#BFD6D1}

  table{width:100%;border-collapse:collapse}
  th{font-size:.82rem;color:var(--muted);font-weight:600;text-align:left;padding:10px 8px;border-bottom:1.5px solid var(--ink)}
  td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr[data-c]{cursor:pointer}
  tr[data-c]:hover{background:#F7F9F6}
  td a{color:var(--ink2)}
  .sub{display:block;color:var(--muted);font-size:.85rem}
  .nw{white-space:nowrap}

  .list .item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .list .item .t{min-width:0;flex:1 1 240px}
  .list .item .t b{display:block}
  code{background:#E4EAE6;padding:2px 7px;border-radius:6px;font-size:.82rem;overflow-wrap:anywhere}
  .done{opacity:.55}

  .auth{min-height:100vh;display:grid;place-items:center;padding:20px}
  .auth form{width:min(100%,390px)}
  .auth .brand{padding:0 0 22px;color:var(--ink)}
  .auth .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  #toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;display:none}
  @media (min-width:821px){#toast{bottom:24px}}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
    .brand,.rail .foot{display:none}
    .nav{flex-direction:row;width:100%;justify-content:space-around}
    .nav button{flex-direction:column;gap:3px;font-size:.72rem;padding:7px 6px;flex:1;align-items:center;justify-content:center;text-align:center}
    main{padding-top:22px;padding-bottom:110px}
    .strip{grid-template-columns:repeat(2,1fr)}
    .strip>div:nth-child(3){padding-left:0;border-left:0}
    .strip>div:nth-child(n+3){border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
  }
  @media (max-width:640px){
    .hide-s{display:none}
    .cols{grid-template-columns:1fr}
    .cols>div+div>label:first-child{margin-top:14px!important}
    .row{gap:10px}
    .row .btn.small{padding:7px 10px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const root = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = location.href.replace(/admin\.html.*$/, '');
const code = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const pl = (n, a, b) => n === 1 ? a : b;
const DAY = 86400000, RISK_DAYS = 14;
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const S = { user:null, store:null, tags:[], customers:[], stats:null, view:'hoje', detail:null,
  chart:{kind:'stamps', range:'dias'}, filter:'todos', q:'', camp:{seg:'risco', msg:null}, firstPaint:true };

/* ---------- avisos e erros ---------- */
function toast(msg, bad){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.style.background = bad ? '#B42318' : '#12805C'; t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4200);
}
window.addEventListener('error', e => toast('Erro na página: ' + e.message, true));
window.addEventListener('unhandledrejection', e => toast('Erro: ' + ((e.reason && e.reason.message) || e.reason), true));

/* ---------- ícones ---------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  users:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/></svg>',
  mega:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg>',
  tap:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="1.6"/><path d="M6 12a6 6 0 0 1 6 6"/><path d="M6 6.5A11.5 11.5 0 0 1 17.5 18"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'
};
const LOGO = '<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#F5B83D" stroke-width="3"/><path d="M10.5 16.5l4 4 7-8" fill="none" stroke="#F5B83D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const NAV = [['hoje','Hoje','home'],['clientes','Clientes','users'],['campanhas','Campanhas','mega'],['tags','Tags','tap'],['regras','Regras','sliders']];

/* ---------- utilidades ---------- */
function head(title, sub, right){
  return `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${right || ''}</div>`;
}
function rel(d){
  if(!d) return 'nunca';
  const dt = new Date(d), now = new Date();
  const a = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((b - a) / DAY);
  const hm = dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  if(days <= 0) return 'hoje, ' + hm;
  if(days === 1) return 'ontem, ' + hm;
  if(days < 30) return 'há ' + days + ' dias';
  return dt.toLocaleDateString('pt-BR');
}
const fmtFull = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const waLink = (c, text) => 'https://wa.me/' + (c.whatsapp.length <= 11 ? '55' + c.whatsapp : c.whatsapp) + (text ? '?text=' + encodeURIComponent(text) : '');
const niceMax = n => { if(n <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(n))), m = n / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };

/* ---------- segmentos de clientes ---------- */
function segments(){
  const C = S.customers, n = C.length, goal = S.store.stamps_goal, now = Date.now();
  const ranked = [...C].sort((a, b) => b.total_stamps - a.total_stamps);
  const top = n ? Math.max(1, Math.ceil(n * .1)) : 0, mid = Math.round(n * .6), tier = {};
  ranked.forEach((c, i) => { tier[c.id] = i < top ? 'fieis' : i < top + mid ? 'regulares' : 'ocasionais'; });
  const out = {todos:C, fieis:[], regulares:[], ocasionais:[], risco:[], faltapouco:[], premio:[]};
  C.forEach(c => {
    out[tier[c.id]].push(c);
    const days = c.last_stamp_at ? Math.floor((now - new Date(c.last_stamp_at)) / DAY) : null;
    if(c.total_stamps >= 2 && days !== null && days >= RISK_DAYS) out.risco.push(c);
    if(goal >= 3 && c.stamps > 0 && goal - c.stamps <= 2) out.faltapouco.push(c);
    if(c.rewards_available > 0) out.premio.push(c);
  });
  return out;
}
const SEGINFO = {
  todos:{n:'Todos', d:''},
  fieis:{n:'Fiéis', d:'os 10% que mais carimbam', c:'#0F3D3E'},
  regulares:{n:'Regulares', d:'os 60% do meio', c:'#4E8F86'},
  ocasionais:{n:'Ocasionais', d:'os 30% que menos carimbam', c:'#B9D3CB'},
  risco:{n:'Em risco', d:'já voltaram antes, mas faz ' + RISK_DAYS + ' dias ou mais que não aparecem', c:'#C0392B'},
  faltapouco:{n:'Quase lá', d:'faltam 2 carimbos ou menos para o prêmio', c:'#F5B83D'},
  premio:{n:'Com prêmio', d:'têm prêmio esperando para resgatar', c:'#1D5557'}
};

/* ---------- dados ---------- */
async function load(){
  const {data:stores, error:e0} = await sb.from('fid_stores').select('*').order('created_at');
  if(e0){ toast('Não foi possível carregar: ' + e0.message, true); return; }
  if(!stores || !stores.length){ S.store = null; render(); return; }
  S.store = stores[0];
  const [t, c, st] = await Promise.all([
    sb.from('fid_tags').select('*').eq('store_id', S.store.id).order('created_at'),
    sb.from('fid_customers').select('*').eq('store_id', S.store.id).order('last_stamp_at', {ascending:false, nullsFirst:false}).range(0, 4999),
    sb.rpc('fid_stats', {p_store: S.store.id})
  ]);
  S.tags = t.data || []; S.customers = c.data || [];
  S.stats = (st.data && !st.data.error) ? st.data : null;
  render();
}
async function openCustomer(cid, stay){
  const [c, ev] = await Promise.all([
    sb.from('fid_customers').select('*').eq('id', cid).single(),
    sb.from('fid_events').select('*').eq('customer_id', cid).order('created_at', {ascending:false}).limit(500)
  ]);
  if(!c.data){ toast('Cliente não encontrado.', true); return; }
  S.detail = {c:c.data, ev:ev.data || []};
  if(stay) render(); else go('cliente');
}
function go(view){ S.view = view; render(); window.scrollTo(0, 0); }

/* ---------- renderização geral ---------- */
function render(){
  if(!S.user) return viewLogin();
  if(!S.store) return viewCreate();
  const nav = NAV.map(([id, label, ic]) =>
    `<button data-go="${id}" ${(S.view === id || (S.view === 'cliente' && id === 'clientes')) ? 'aria-current="page"' : ''}>${ICON[ic]}<span>${label}</span></button>`).join('');
  const v = ({hoje:viewHoje, clientes:viewClientes, cliente:viewCliente, campanhas:viewCampanhas, tags:viewTags, regras:viewRegras})[S.view]();
  root.innerHTML = `<div class="shell"><aside class="rail"><div class="brand">${LOGO}<span>Fidelidade</span></div>
    <nav class="nav" aria-label="Seções">${nav}</nav>
    <div class="foot"><div>${esc(S.user.email || '')}</div><button id="out" class="linkbtn">Sair</button></div></aside>
    <main>${v.html}</main></div>`;
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('#out').onclick = async () => { await sb.auth.signOut(); S.user = null; S.store = null; render(); };
  if(v.bind) v.bind();
  if(S.view === 'hoje') S.firstPaint = false;
}

/* ---------- entrada e criação da loja ---------- */
function viewLogin(msg){
  root.innerHTML = `<div class="auth"><form id="f"><div class="brand">${LOGO}<span>Fidelidade</span></div>
    <h1>Entrar no painel</h1>
    <label for="e">E-mail</label><input id="e" name="e" type="email" required autocomplete="email">
    <label for="p">Senha (mínimo 6 caracteres)</label><input id="p" name="p" type="password" required minlength="6" autocomplete="current-password">
    <div class="actions"><button class="btn" value="in">Entrar</button><button class="btn line" value="up" formnovalidate>Criar conta</button></div>
    <p class="err" role="alert">${esc(msg || '')}</p></form></div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const a = ev.submitter && ev.submitter.value, e = ev.target.e.value, p = ev.target.p.value;
    const r = a === 'up' ? await sb.auth.signUp({email:e, password:p}) : await sb.auth.signInWithPassword({email:e, password:p});
    if(r.error) return viewLogin(r.error.message);
    if(!r.data.session){
      const r2 = await sb.auth.signInWithPassword({email:e, password:p});
      if(r2.error) return viewLogin('Conta criada, mas não deu para entrar: ' + r2.error.message);
    }
    boot();
  };
}
function viewCreate(){
  root.innerHTML = `<div class="auth"><form id="f"><div class="brand">${LOGO}<span>Fidelidade</span></div>
    <h1>Crie a sua loja</h1>
    <label for="n">Nome do estabelecimento</label><input id="n" name="n" type="text" required>
    <label for="r">Prêmio</label><input id="r" name="r" type="text" value="Brinde grátis" required>
    <div class="cols"><div><label for="g">Carimbos para o prêmio</label><input id="g" name="g" type="number" min="2" max="50" value="10"></div>
    <div><label for="cd">Intervalo entre carimbos (min)</label><input id="cd" name="cd" type="number" min="0" value="60"></div></div>
    <div class="actions"><button class="btn">Criar loja e primeira tag</button></div></form></div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const {data:s, error} = await sb.from('fid_stores').insert({owner:S.user.id, name:f.n.value, reward:f.r.value, stamps_goal:+f.g.value, cooldown_minutes:+f.cd.value}).select().single();
    if(error) return toast('Não foi possível criar a loja: ' + error.message, true);
    await sb.from('fid_tags').insert({id:code(), store_id:s.id, label:'Balcão'});
    load();
  };

function drawChart(){
  const el = document.getElementById('chart'); if(!el || !S.stats) return;
  const {kind, range} = S.chart;
  const rows = (range === 'dias' ? S.stats.daily : S.stats.monthly) || [];
  const vals = rows.map(r => +r[kind] || 0);
  const labels = rows.map(r => range === 'dias' ? r.d.slice(8, 10) + '/' + r.d.slice(5, 7) : MES[+r.m.slice(5, 7) - 1]);
  const W = Math.max(280, el.clientWidth), H = 240, pl_ = 34, pr = 6, pt = 24, pb = 30;
  const max = niceMax(Math.max(0, ...vals)), iw = W - pl_ - pr, ih = H - pt - pb, bw = iw / Math.max(1, vals.length);
  const every = Math.max(1, Math.ceil(40 / bw));
  let g = '';
  [0, .5, 1].forEach(f => { const y = pt + ih - f * ih;
    g += `<line x1="${pl_}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#D5DCD7"/><text x="${pl_ - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#586C6A">${Math.round(max * f)}</text>`; });
  vals.forEach((v, i) => {
    const h = v / max * ih, x = pl_ + i * bw + bw * .16, w = bw * .68, y = pt + ih - h, last = i === vals.length - 1;
    if(v > 0) g += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 2)}" rx="${Math.min(6, w / 2)}" fill="${last ? '#F5B83D' : '#0F3D3E'}" ${last ? 'stroke="#0F3D3E" stroke-width="1.5"' : ''}/><text x="${x + w / 2}" y="${y - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="#0F3D3E">${v}</text>`;
    if((vals.length - 1 - i) % every === 0) g += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#586C6A">${labels[i]}</text>`;
  });
  const total = vals.reduce((a, b) => a + b, 0);
  if(!total) g += `<text x="${W / 2}" y="${pt + ih / 2}" text-anchor="middle" font-size="14" fill="#586C6A">Ainda sem movimento neste período</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de barras: ${total} no período">${g}</svg>`;
}
let _rz; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if(S.user && S.view === 'hoje') drawChart(); }, 150); });

  premio:'Oi, {nome}! Você tem {premios} {premio_s} na {loja}: {premio}. É só mostrar o cartão no balcão.',
  fieis:'Oi, {nome}! Você é um dos nossos clientes mais fiéis na {loja}. Passa aqui, temos uma novidade para você.',
  todos:'Oi, {nome}! Aqui é da {loja}. Passa aqui hoje, temos uma novidade para você.'
};
function fill(tpl, c){
  const s = S.store, falt = s.stamps_goal - c.stamps;
  return tpl.replace(/\{nome\}/g, c.name.split(' ')[0]).replace(/\{loja\}/g, s.name).replace(/\{premio\}/g, s.reward)
    .replace(/\{carimbos\}/g, c.stamps).replace(/\{meta\}/g, s.stamps_goal).replace(/\{faltam\}/g, falt)
    .replace(/\{carimbo_s\}/g, falt === 1 ? 'carimbo' : 'carimbos').replace(/\{premios\}/g, c.rewards_available)
    .replace(/\{premio_s\}/g, c.rewards_available === 1 ? 'prêmio disponível' : 'prêmios disponíveis');

      const {error} = await sb.from('fid_stores').update({stamps_goal:+f.g.value, cooldown_minutes:+f.cd.value, reward:f.r.value, color:f.co.value,
        max_per_day:+f.md.value, geo_required:f.gr.checked, geo_radius_m:+f.gm.value,
        geo_lat:f.gl.value === '' ? null : +f.gl.value, geo_lng:f.gn.value === '' ? null : +f.gn.value}).eq('id', S.store.id);
      btn.disabled = false;
      if(error){ toast('Erro ao salvar: ' + error.message, true); return; }
      await load(); toast('Regras salvas ✓');
    };
  }};
}

/* ---------- início ---------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  S.user = session ? session.user : null;
  if(S.user) await load(); else render();
}
boot();
</script>
