<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Fidelidade</title>
<style>
  :root{--c:#7c3aed;--bg:#f6f4fb;--ink:#1c1530;--mut:#6b6485}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:1.3rem;margin:0 0 14px} h2{font-size:1.05rem;margin:0 0 10px}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border:1.5px solid #ddd6ee;border-radius:10px;font-size:1rem;background:#fff;color:var(--ink)}
  button{padding:11px 16px;border:0;border-radius:10px;background:var(--c);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
  button.sec{background:#ede9fe;color:var(--c)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:#faf8ff;border-radius:12px;padding:12px;text-align:center}
  .kpi b{display:block;font-size:1.4rem}.kpi span{font-size:.72rem;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee}
  th{color:var(--mut);font-weight:600;font-size:.75rem}
  code{background:#f1eefb;padding:2px 6px;border-radius:6px;font-size:.78rem;word-break:break-all}
  .hide{display:none}.err{color:#b42318}.mut{color:var(--mut);font-size:.85rem}
  .top{display:flex;justify-content:space-between;align-items:center}
  @media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const app = document.getElementById('app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = location.href.replace(/admin\.html.*$/,'');
const code = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  session ? panel(session.user) : login();
}

function login(msg){
  app.innerHTML = `<h1>Painel Fidelidade</h1><form class="card" id="f">
    <label>E-mail</label><input name="e" type="email" required autocomplete="email">
    <label>Senha (mín. 6)</label><input name="p" type="password" required minlength="6" autocomplete="current-password">
    <button name="a" value="in">Entrar</button> <button class="sec" name="a" value="up" formnovalidate>Criar conta</button>
    <p class="err" id="m">${esc(msg||'')}</p></form>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const a = ev.submitter?.value, e = ev.target.e.value, p = ev.target.p.value;
    const r = a==='up' ? await sb.auth.signUp({email:e,password:p}) : await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error) return login(r.error.message);
    if(!r.data.session){
      const r2 = await sb.auth.signInWithPassword({email:e,password:p});
      if(r2.error) return login('Conta criada, mas não deu para entrar: '+r2.error.message);
    }
    boot();
  };
}

async function panel(user){
  const {data:stores} = await sb.from('fid_stores').select('*').order('created_at');
  if(!stores?.length) return createStore();
  const s = stores[0];
  const [{data:tags},{data:cust},{data:ev}] = await Promise.all([
    sb.from('fid_tags').select('*').eq('store_id',s.id).order('created_at'),
    sb.from('fid_customers').select('*').eq('store_id',s.id).order('last_stamp_at',{ascending:false,nullsFirst:false}),
    sb.from('fid_events').select('kind,created_at').eq('store_id',s.id)
  ]);
  const today = new Date(); today.setHours(0,0,0,0);
  const stampsToday = (ev||[]).filter(e=>e.kind==='stamp' && new Date(e.created_at)>=today).length;
  const totalStamps = (ev||[]).filter(e=>e.kind==='stamp').length;
  const redeems = (ev||[]).filter(e=>e.kind==='redeem').length;
  app.innerHTML = `<div class="top"><h1>${esc(s.name)}</h1><button class="sec" id="out">Sair</button></div>
  <div class="card"><div class="kpis">
    <div class="kpi"><b>${cust.length}</b><span>clientes</span></div>
    <div class="kpi"><b>${stampsToday}</b><span>carimbos hoje</span></div>
    <div class="kpi"><b>${totalStamps}</b><span>carimbos total</span></div>
    <div class="kpi"><b>${redeems}</b><span>resgates</span></div></div></div>

  <div class="card"><h2>Tags NFC (gravar a URL em cada bastão)</h2>
    ${(tags||[]).map(t=>`<p><b>${esc(t.label||'Tag')}</b> ${t.active?'':'(desativada)'}<br><code>${esc(base)}c.html?t=${esc(t.id)}</code></p>`).join('')||'<p class="mut">Nenhuma tag ainda.</p>'}
    <div class="row"><input id="lbl" placeholder="Nome da tag (ex.: Balcão)"><button id="addtag">+ Nova tag</button></div>
    <p class="mut">Use o app "NFC Tools" para gravar a URL como registro do tipo URL/URI.</p></div>

  <div class="card"><h2>Clientes</h2>
    <table><tr><th>Nome</th><th>WhatsApp</th><th>Carimbos</th><th>Prêmios</th><th>Último</th></tr>
    ${cust.map(c=>`<tr data-c="${c.id}" style="cursor:pointer"><td><b>${esc(c.name)}</b> ›</td><td><a onclick="event.stopPropagation()" href="https://wa.me/${esc(c.whatsapp.length<=11?'55'+c.whatsapp:c.whatsapp)}" target="_blank">${esc(c.whatsapp)}</a></td>
      <td>${c.stamps}/${s.stamps_goal}</td><td>${c.rewards_available}</td>
      <td>${c.last_stamp_at?new Date(c.last_stamp_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">Sem clientes ainda.</td></tr>'}
    </table></div>

  <div class="card"><h2>Regras</h2><form id="rf">
    <div class="row"><div><label>Carimbos para o prêmio</label><input name="g" type="number" min="2" max="50" value="${s.stamps_goal}"></div>
    <div><label>Intervalo entre carimbos (min)</label><input name="cd" type="number" min="0" value="${s.cooldown_minutes}"></div></div>
    <label>Prêmio</label><input name="r" value="${esc(s.reward)}">
    <label>Cor</label><input name="co" type="color" value="${esc(s.color)}">
    <label>Máx. de carimbos por cliente por dia</label><input name="md" type="number" min="1" max="50" value="${s.max_per_day}">
    <label style="display:flex;gap:8px;align-items:center"><input name="gr" type="checkbox" style="width:auto" ${s.geo_required?'checked':''}> Exigir que o cliente esteja na loja (confere a localização do celular)</label>
    <div class="row"><div><label>Raio permitido (metros)</label><input name="gm" type="number" min="20" max="5000" value="${s.geo_radius_m}"></div>
    <div><label>Local da loja</label><input name="gl" type="hidden" value="${s.geo_lat??''}"><input name="gn" type="hidden" value="${s.geo_lng??''}"><button type="button" class="sec" id="geo" style="margin-top:0;width:100%">${s.geo_lat!=null?'Atualizar para o local onde estou':'Usar minha localização atual'}</button></div></div>
    <p class="mut" id="geost">${s.geo_lat!=null?'Local salvo ✓ ('+(+s.geo_lat).toFixed(5)+', '+(+s.geo_lng).toFixed(5)+')':'Local ainda não definido. Estando na loja, toque no botão acima e depois em Salvar regras.'}</p>
    <button>Salvar regras</button></form></div>`;
  document.getElementById('out').onclick = async()=>{await sb.auth.signOut();boot()};
  app.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>customerView(user,s,tags||[],tr.dataset.c));
  document.getElementById('geo').onclick = ()=>{
    const st = document.getElementById('geost'); st.textContent = 'Obtendo localização…';
    if(!navigator.geolocation){ st.textContent = 'Este navegador não oferece localização.'; return; }
    navigator.geolocation.getCurrentPosition(p=>{
      const f = document.getElementById('rf'); f.gl.value = p.coords.latitude; f.gn.value = p.coords.longitude;
      st.textContent = 'Local capturado ✓ (precisão ~'+Math.round(p.coords.accuracy)+' m). Toque em "Salvar regras".';
    }, ()=>{ st.textContent = 'Não foi possível obter a localização (permita o acesso no navegador).'; }, {enableHighAccuracy:true,timeout:15000});
  };
  document.getElementById('addtag').onclick = async()=>{
    const {error} = await sb.from('fid_tags').insert({id:code(),store_id:s.id,label:document.getElementById('lbl').value||'Tag'});
    if(error) alert(error.message); panel(user);
  };
  document.getElementById('rf').onsubmit = async ev=>{
    ev.preventDefault(); const f=ev.target;
    if(f.gr.checked && f.gl.value===''){ return alert('Para exigir localização, defina o local da loja: estando na loja, toque em "Usar minha localização atual".'); }
    const {error} = await sb.from('fid_stores').update({stamps_goal:+f.g.value,cooldown_minutes:+f.cd.value,reward:f.r.value,color:f.co.value,max_per_day:+f.md.value,geo_required:f.gr.checked,geo_radius_m:+f.gm.value,geo_lat:f.gl.value===''?null:+f.gl.value,geo_lng:f.gn.value===''?null:+f.gn.value}).eq('id',s.id);
    if(error) alert(error.message); else panel(user);
  };
}

async function customerView(user, s, tags, cid){
  const [{data:c},{data:ev}] = await Promise.all([
    sb.from('fid_customers').select('*').eq('id',cid).single(),
    sb.from('fid_events').select('*').eq('customer_id',cid).order('created_at',{ascending:false}).limit(500)
  ]);
  if(!c) return panel(user);
  const events = ev||[];
  const tagName = id => (tags.find(t=>t.id===id)||{}).label || id || '-';
  const kind = {stamp:'Carimbo',reward_earned:'Prêmio conquistado',redeem:'Resgate',adjust:'Ajuste manual'};
  const fmt = d => new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  app.innerHTML = `<div class="top"><h1>${esc(c.name)}</h1><button class="sec" id="back">← Voltar</button></div>
  <div class="card"><p class="mut">WhatsApp ${esc(c.whatsapp)} · cliente desde ${fmt(c.created_at)}</p>
    <div class="kpis">
      <div class="kpi"><b>${c.stamps}/${s.stamps_goal}</b><span>no cartão</span></div>
      <div class="kpi"><b>${c.rewards_available}</b><span>prêmios disponíveis</span></div>
      <div class="kpi"><b>${c.total_stamps}</b><span>carimbos total</span></div>
      <div class="kpi"><b>${c.rewards_redeemed}</b><span>resgates</span></div></div></div>
  <div class="card"><h2>Ajustar manualmente</h2><form id="af"><div class="row">
    <div><label>Carimbos no cartão (0 a ${s.stamps_goal-1})</label><input name="s" type="number" min="0" max="${s.stamps_goal-1}" value="${c.stamps}" required></div>
    <div><label>Prêmios disponíveis</label><input name="r" type="number" min="0" value="${c.rewards_available}" required></div></div>
    <button>Salvar ajuste</button></form><p class="mut">Todo ajuste fica registrado no histórico.</p></div>
  <div class="card"><h2>Histórico (${events.length})</h2>
    <table><tr><th>Data e hora</th><th>Evento</th><th>Tag</th></tr>
    ${events.map(e=>`<tr><td>${fmt(e.created_at)}</td><td>${esc(kind[e.kind]||e.kind)}${e.detail?`<br><span class="mut">${esc(e.detail)}</span>`:''}</td><td>${e.kind==='adjust'?'-':esc(tagName(e.tag_id))}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">Sem eventos.</td></tr>'}
    </table></div>`;
  document.getElementById('back').onclick = ()=>panel(user);
  document.getElementById('af').onsubmit = async ev2=>{
    ev2.preventDefault(); const f=ev2.target;
    const {data,error} = await sb.rpc('fid_admin_adjust',{p_customer:cid,p_stamps:+f.s.value,p_rewards:+f.r.value});
    if(error || data?.error) return alert('Não foi possível salvar: '+(error?.message||data.error));
    customerView(user,s,tags,cid);
  };
}

function createStore(){
  app.innerHTML = `<h1>Criar sua loja</h1><form class="card" id="f">
    <label>Nome do estabelecimento</label><input name="n" required>
    <label>Prêmio</label><input name="r" value="Brinde grátis" required>
    <div class="row"><div><label>Carimbos para o prêmio</label><input name="g" type="number" min="2" max="50" value="10"></div>
    <div><label>Intervalo entre carimbos (min)</label><input name="cd" type="number" min="0" value="30"></div></div>
    <button>Criar loja e primeira tag</button></form>`;
  document.getElementById('f').onsubmit = async ev=>{
    ev.preventDefault(); const f=ev.target;
    const {data:{user}} = await sb.auth.getUser();
    const {data:s,error} = await sb.from('fid_stores').insert({owner:user.id,name:f.n.value,reward:f.r.value,stamps_goal:+f.g.value,cooldown_minutes:+f.cd.value}).select().single();
    if(error) return alert(error.message);
    await sb.from('fid_tags').insert({id:code(),store_id:s.id,label:'Balcão'});
    boot();
  };
}
boot();
</script>
</body>
</html>
