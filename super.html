<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B0B40">
<title>Carimbô · Admin</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest-admin.webmanifest"><meta name="theme-color" content="#14296B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--night:#0E1D4E;--night2:#14296B;--primary:#14296B;--primary-d:#0E1D4E;--lilac:#F3EAD6;--gold:#EAD9B6;--red:#E03A2F;
    --paper:#FBF7EE;--ink:#14296B;--muted:#3D4C80;--line:#E4D9C0;--good:#0E7A47;--warn:#B45309;--bad:#C0392B;
    --sh:4px 4px 0 #14296B;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3,.btn,.brand,.tile b,.nums b{font-family:'Fredoka','Nunito',system-ui,sans-serif}
  h1,h2,h3{margin:0;font-weight:600}
  .wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
  /* faixa escura */
  .hero{background:radial-gradient(900px 400px at 85% -10%,rgba(224,58,47,.35),transparent 60%),linear-gradient(135deg,var(--night),var(--night2));color:#fff;padding:22px 0 88px;border-bottom:4px solid var(--red)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.1rem;letter-spacing:.01em}
  .logo{width:40px;height:40px;border-radius:12px;background:#FBF7EE;border:2.5px solid #FBF7EE;display:grid;place-items:center;box-shadow:3px 3px 0 var(--red)}
  .logo svg{width:26px;height:26px}
  .crown{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(234,217,182,.6);border-radius:99px;padding:2px 10px;margin-left:4px;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 20px;border:2.5px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn.line{background:#fff;color:var(--ink);border:2.5px solid var(--ink)}
  .btn.line:hover{background:var(--lilac)}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.18)}
  .btn.danger{background:#fff;color:var(--bad);border:2.5px solid var(--bad);box-shadow:none}
  .ovl{position:fixed;inset:0;background:rgba(14,29,78,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 4px;font-family:'Fredoka',sans-serif}
  .modal label{display:block;font-size:.85rem;font-weight:700;color:var(--ink);margin:14px 0 5px}
  .modal input[type=text],.modal textarea,.modal select{width:100%;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;font:inherit;background:#fff}
  .modal textarea{resize:vertical}
  .btn.danger:hover{background:#FDECEA}
  .btn.small{min-height:36px;padding:6px 14px;font-size:.9rem}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .title{margin-top:30px}
  .title h1{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:700;letter-spacing:-.01em}
  .title p{margin:4px 0 0;color:rgba(255,255,255,.68)}
  /* indicadores sobre a faixa */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:-56px}
  .tile{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--sh);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.6)}
  .tile .k{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}
  .tile .k i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:.9rem;background:var(--lilac)}
  .tile b{display:block;font-size:2.1rem;line-height:1.1;margin-top:10px;font-weight:700}
  .tile small{color:var(--muted)}
  .tile.warn i{background:#FEF0D0}.tile.warn b{color:var(--warn)}
  .tile.bad i{background:#FDE1DE}.tile.bad b{color:var(--bad)}
  .tile.good i{background:#DDF5EA}
  .tile svg.sp{position:absolute;right:0;bottom:0;left:0;width:100%;height:46px;opacity:.9}
  .tile.big b{margin-bottom:26px}
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
  .mini div{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mini b{font-size:1.25rem}.mini span{color:var(--muted);font-size:.85rem}
  /* barra de ferramentas */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:26px 0 18px}
  .search{position:relative;flex:1 1 240px;max-width:360px}
  .search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:3px 3px 0 var(--red);border-color:var(--red)}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;cursor:pointer;font-size:.9rem;color:var(--ink)}
  .chip:hover{border-color:#C9B8F2}
  .chip[aria-pressed=true]{background:var(--night2);border-color:var(--night2);color:#fff}
  .chip small{opacity:.7;margin-left:6px}
  .seg{margin-left:auto;display:flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px}
  .seg button{border:0;background:none;border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button[aria-pressed=true]{background:var(--lilac);color:var(--primary-d)}
  /* cartões de loja */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .sc{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);border:1px solid #EFEAF8;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .sc:hover{transform:translateY(-3px);box-shadow:0 18px 36px -16px rgba(60,20,140,.35)}
  .sc::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--acc,var(--primary))}
  .sc.s-ativa{--acc:linear-gradient(90deg,#10B981,#34D399)}.sc.s-trial{--acc:linear-gradient(90deg,#3B82F6,#60A5FA)}
  .sc.s-tolerancia{--acc:linear-gradient(90deg,#F59E0B,#FBBF24)}.sc.s-vencida{--acc:linear-gradient(90deg,#EF4444,#F87171)}.sc.s-bloqueada{--acc:linear-gradient(90deg,#14296B,#14296B)}
  .sc .h{display:flex;gap:12px;align-items:center}
  .av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;flex:none;letter-spacing:.02em}
  .av.lg{width:72px;height:72px;border-radius:22px;font-size:1.6rem;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
  .sc .nm{min-width:0;flex:1}
  .sc .nm b{display:block;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc .nm span{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:.78rem;font-weight:600;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .st-ativa{background:#DDF5EA;color:#0F6B49}.st-trial{background:#E0ECFF;color:#1D4ED8}
  .st-tolerancia{background:#FEF0D0;color:#92400E}.st-vencida{background:#FDE1DE;color:#A52A1E}.st-bloqueada{background:#2B2140;color:#fff}
  .ren{margin-top:18px}
  .ren .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;color:var(--muted)}
  .ren .r1 b{color:var(--ink);font-size:.98rem}
  .prog{height:7px;border-radius:99px;background:#EEE9F8;margin-top:8px;overflow:hidden}
  .prog i{display:block;height:100%;border-radius:99px;background:var(--ink)}
  .prog.warn i{background:linear-gradient(90deg,#F59E0B,#FBBF24)}.prog.bad i{background:linear-gradient(90deg,#EF4444,#F87171)}
  .dl{font-size:.82rem;color:var(--muted)}.dl.bad{color:var(--bad);font-weight:600}.dl.warn{color:var(--warn);font-weight:600}
  .nums{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:8px;margin-top:16px;align-items:end}
  .nums div b{display:block;font-size:1.3rem;line-height:1.1}.nums div small{color:var(--muted);font-size:.76rem}
  .nums svg{width:100%;height:40px}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted)}
  .aff{background:var(--lilac);color:var(--primary-d);border-radius:99px;padding:2px 10px;font-weight:600}
  .go{color:var(--primary-d);font-weight:600}
  /* tabela */
  .tw{overflow-x:auto;border-radius:20px;background:#fff;box-shadow:var(--sh);border:1px solid #EFEAF8}
  table{width:100%;border-collapse:collapse;min-width:960px}
  th,td{padding:14px 16px;text-align:left;border-bottom:1px solid #F0ECF8;vertical-align:middle}
  th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:#FBFAFE}
  tbody tr{cursor:pointer}tbody tr:hover{background:#FAF8FF}tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right}
  .cell{display:flex;align-items:center;gap:12px}.cell .av{width:38px;height:38px;border-radius:12px;font-size:.9rem}
  /* detalhe */
  .back{color:rgba(255,255,255,.8);background:none;border:0;cursor:pointer;padding:0;font-weight:600}
  .back:hover{color:#fff}
  .dh{display:flex;align-items:center;gap:22px;margin-top:26px;flex-wrap:wrap}
  .dh .t{flex:1 1 280px;min-width:0}
  .dh h1{font-size:clamp(1.7rem,3vw,2.3rem)}
  .dh p{margin:4px 0 10px;color:rgba(255,255,255,.7)}
  .ring{position:relative;width:128px;height:128px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring b{font-size:2rem;line-height:1}.ring small{font-size:.68rem;color:rgba(255,255,255,.72);display:block;max-width:74px;line-height:1.2;margin:2px auto 0}
  .grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:18px}
  .panel{background:#fff;border-radius:22px;padding:22px 24px;box-shadow:var(--sh);border:1px solid #EFEAF8}
  .panel h2{font-size:1.1rem;display:flex;align-items:center;gap:10px}
  .panel h2 i{width:30px;height:30px;border-radius:10px;background:var(--lilac);display:grid;place-items:center;font-style:normal;font-size:.95rem}
  .sub{color:var(--muted);font-size:.88rem;margin:8px 0 0}
  .steps{display:flex;margin:22px 0 6px;position:relative}
  .steps::before{content:"";position:absolute;left:12px;right:12px;top:11px;height:3px;background:#E8E1F7;border-radius:2px}
  .step{flex:1;text-align:center;position:relative;font-size:.8rem;color:var(--muted)}
  .step i{display:block;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #D5C9F0;margin:0 auto 8px;position:relative}
  .step.on i{background:var(--primary);border-color:var(--primary)}
  .step.last i{border-color:var(--gold);background:var(--gold)}
  .step b{display:block;color:var(--ink);font-size:.95rem}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .sect{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .sect h3{font-size:1rem}
  .bars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:16px}
  .bars i{flex:1;background:var(--ink);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.95;transition:opacity .1s}
  .bars i:hover{opacity:.7}
  .bars i.z{background:#EAE4F7}
  .hlab{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:6px}
  .mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin-top:14px}
  .mrow div{background:#F7F4FD;border-radius:12px;padding:9px 6px;text-align:center}.mrow b{display:block;font-size:1.1rem}.mrow small{color:var(--muted)}
  code{background:var(--lilac);color:var(--night2);padding:3px 8px;border-radius:7px;font-size:.78rem;overflow-wrap:anywhere}
  .trow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0;border-bottom:1px solid #F0ECF8;flex-wrap:wrap}
  .trow:last-child{border-bottom:0}.trow .l{min-width:0;flex:1 1 240px}
  .bl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;padding:12px 0;border-bottom:1px solid #F0ECF8;align-items:center}
  .bl:last-child{border-bottom:0}.bl .a{font-weight:700}.bl small{color:var(--muted)}
  .kind{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--lilac)}
  .auth{max-width:400px;margin:12vh auto;background:#fff;border-radius:24px;padding:32px;box-shadow:0 30px 60px -30px rgba(40,10,100,.5)}
  .auth .brand{color:var(--ink)}
  .err{color:var(--bad);min-height:1.2em}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);color:#fff;padding:12px 22px;border-radius:12px;z-index:99;display:none;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
  .pad{padding-bottom:70px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
  .tab{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:8px 18px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.98rem}
  .tab:hover{background:rgba(255,255,255,.16)}
  .tab[aria-selected=true]{background:#FBF7EE;color:var(--night2);border-color:#FBF7EE}
  .tab i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:1px 8px;font-size:.75rem;margin-left:8px}
  .hero.slim{padding-bottom:44px}
  .after{margin-top:22px}
  .rcard{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--sh);border:1px solid #EFEAF8;margin-bottom:14px}
  .rcard .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .rcard h3{font-size:1.1rem}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
  .kv div{background:#F7F4FD;border-radius:12px;padding:8px 12px}.kv b{display:block;font-family:'Fredoka',sans-serif;font-size:1.1rem}.kv small{color:var(--muted)}
  .kv div.neg b{color:var(--bad)}
  .ln2{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;border-bottom:1px solid #F0ECF8}.ln2:last-child{border-bottom:0}
  .ln2 .a{font-weight:700;font-family:'Fredoka',sans-serif;text-align:right}.ln2 .a.neg{color:var(--bad)}.ln2 small{color:var(--muted)}
  .acts select{width:auto;min-width:220px}
  details.lines summary{cursor:pointer;color:var(--primary-d);font-weight:700;margin-top:10px}
  .stt{background:#FEF0D0;color:#92400E}
  .hint{display:block;color:var(--muted);font-size:.8rem;margin-top:5px;line-height:1.35}
  .prev{margin-top:16px;background:#F7F4FD;border:1.5px dashed #C9B8F2;border-radius:14px;padding:12px 14px;font-size:.9rem;line-height:1.55}
  .rcard a,.st a{color:var(--primary-d)}
  .panel .rcard{box-shadow:none;border:1.5px solid var(--line)}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.seg{margin-left:0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ===== visual simples (sobrescreve o acima) ===== */
  :root{--sh:none}
  body{background:#fff}
  .hero,.hero.slim{background:#fff;color:var(--ink);padding:14px 0 0;border-bottom:1px solid var(--line)}
  .hero.slim{padding-bottom:0}
  .logo{width:32px;height:32px;border:0;border-radius:8px;box-shadow:none;background:none}
  .logo svg{width:28px;height:28px}
  .brand span[style]{color:var(--red)!important}
  .crown{color:var(--muted);border-color:var(--line);letter-spacing:.08em}
  .btn{box-shadow:none;border-width:1px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;min-height:40px;padding:8px 16px}
  .btn:active{transform:none;box-shadow:none}
  .btn.line,.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.line:hover,.btn.ghost:hover{background:var(--paper);border-color:var(--ink)}
  .btn.danger{border-width:1px}
  .btn.small{min-height:34px;padding:5px 12px}
  .title{margin-top:18px}
  .title h1{font-size:1.5rem;font-weight:700;color:var(--ink)}
  .title p{color:var(--muted)}
  .hero .wrap>.title{padding-bottom:16px}
  .tabs{gap:0;margin-top:14px;overflow-x:auto;flex-wrap:nowrap}
  .tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);padding:10px 4px;margin-right:20px;font-family:'Nunito',sans-serif;font-weight:700;white-space:nowrap}
  .tab:hover{background:none;color:var(--ink)}
  .tab[aria-selected=true]{background:none;color:var(--ink);border-bottom-color:var(--red)}
  .tab i{margin-left:6px}
  .back{color:var(--muted)}.back:hover{color:var(--ink)}
  .tiles{margin-top:22px;gap:12px}
  .tile,.panel,.rcard,.tw,.sc{box-shadow:none;border:1px solid var(--line);border-radius:12px;background:#fff}
  .tile .k i,.panel h2 i{display:none}
  .tile b{font-family:'Nunito',sans-serif;font-size:1.8rem;margin-top:6px}
  .tile.warn b,.tile.bad b{color:inherit}
  .tile.big b{margin-bottom:0}
  svg.sp,.nums svg{display:none}
  .nums{grid-template-columns:repeat(3,1fr)}
  .nums div b{font-family:'Nunito',sans-serif}
  .mini div{background:#fff;border-radius:10px}
  .sc{padding:18px}.sc::before{display:none}
  .sc:hover{transform:none;box-shadow:none;border-color:var(--ink)}
  .av,.av.lg{background:var(--paper)!important;color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:10px}
  .av.lg{width:56px;height:56px;font-size:1.2rem}
  .pill{font-weight:700}
  .prog{height:5px}.prog i{background:var(--ink)}.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
  .st-bloqueada{background:var(--ink)}
  .foot{border-top:1px solid var(--line)}
  .aff{background:var(--paper)}
  th{background:var(--paper)}
  tbody tr:hover{background:var(--paper)}
  th,td{border-bottom-color:var(--line)}
  .dh{margin-top:18px}.dh h1{font-size:1.5rem;font-family:'Nunito',sans-serif;font-weight:800;color:var(--ink)}.dh p{color:var(--muted)}

<body>
<div id="app"></div>
<div id="pushModal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/cash.js"></script>
<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});;
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} /* pede ao navegador para não apagar o login guardado */
document.addEventListener('visibilitychange', () => { if(!document.hidden) sb.auth.getSession().catch(() => {}); }); /* ao voltar para o app, renova o login se precisar */
const root = document.getElementById('app');
/* Clique em linha/cartão que abre algo, sem atrapalhar quem quer copiar texto:
   ignora o clique se há texto selecionado, e o duplo clique (selecionar palavra) cancela a ação. */
const hasSel = () => { try { return String(getSelection()).trim() !== ''; } catch(_) { return false; } };
function onTap(el, fn, skip){
  el.onclick = e => {
    if(skip && e.target.closest(skip)) return;
    clearTimeout(el._tap);
    if(e.detail > 1 || hasSel()) return;
    el._tap = setTimeout(() => { if(!hasSel()) fn(e); }, 230);
  };
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl = (n, a, b) => n === 1 ? a : b;
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const STATUS = {ativa:'Ativa', trial:'Em teste', tolerancia:'Em tolerância', vencida:'Vencida', bloqueada:'Bloqueada'};
const fmtDate = d => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
const fmtDT = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const money = v => v == null ? '' : 'R$ ' + Number(v).toFixed(2).replace('.', ',');
const addDays = (iso, n) => { const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const baseUrl = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const ini = n => (String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
const GRAD = ['#14296B,#0E1D4E', '#E03A2F,#9A2A12', '#0EA5E9,#1D4ED8', '#10B981,#047857', '#F59E0B,#B45309', '#EC4899,#9D174D', '#6366F1,#3730A3'];
const grad = n => { let h = 0; for(const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `linear-gradient(135deg,${GRAD[h % GRAD.length]})`; };
const I = {
  logo:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="22" r="13" fill="#14296B"/><rect x="44" y="30" width="12" height="26" fill="#14296B"/><rect x="22" y="54" width="56" height="16" rx="6" fill="#14296B"/><rect x="14" y="78" width="72" height="9" rx="4.5" fill="#E03A2F"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
};

const S = {user:null, today:null, stores:[], spark:[], filter:'todas', q:'', view:'cards', detail:null, tab:'lojas', tickets:[], orders:[], reps:[], next:null, preview:null, payouts:[], repOpen:null, repReqs:[], repForm:null, trials:{items:[], reps:[]}, leads:[], leadsF:'pend', tum:null, tumDays:30, open:{}, fin:null, finMonths:6, push:null};

function toast(msg, bad){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.style.background = bad ? '#B42318' : '#12805C'; t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4000);
}
window.addEventListener('unhandledrejection', e => toast('Erro: ' + ((e.reason && e.reason.message) || e.reason), true));
async function rpc(fn, args){
  const {data, error} = await sb.rpc(fn, args || {});
  if(error){ toast('Erro: ' + error.message, true); return null; }
  if(data && data.error){ toast('Não foi possível: ' + data.error, true); return null; }
  return data;
}
function spark(vals, color, h = 40){
  const n = vals.length; if(!n) return '';
  const max = Math.max(1, ...vals), W = 100, pts = vals.map((v, i) => [i / Math.max(1, n - 1) * W, h - 4 - v / max * (h - 10)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg class="sp" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${line} ${W},${h}" fill="url(#${id})"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------- entrada ---------- */
function viewLogin(msg){
  root.innerHTML = `<div class="auth"><div class="brand"><span class="logo">${I.logo}</span>Admin</div><h1 style="margin-top:20px;font-size:1.4rem">Entrar</h1>
    <form id="f"><label for="e">E-mail</label><input id="e" type="email" required autocomplete="email">
    <label for="p">Senha</label><input id="p" type="password" required autocomplete="current-password">
    <p class="err">${esc(msg || '')}</p><button class="btn" style="width:100%">Entrar</button></form></div>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const r = await sb.auth.signInWithPassword({email:$('#e').value, password:$('#p').value});
    if(r.error) return viewLogin('E-mail ou senha incorretos.');
    boot();
  };
}
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return viewLogin();
  S.user = session.user;
  const {data:ok} = await sb.rpc('fid_is_super');
  if(!ok){ root.innerHTML = `<div class="auth"><h1 style="font-size:1.3rem">Sem acesso</h1><p class="sub">Esta área é restrita ao administrador.</p><button class="btn line" id="o" style="margin-top:14px">Sair</button></div>`; $('#o').onclick = async () => { await sb.auth.signOut(); boot(); }; return; }
  await loadAll(); await loadTab(true); if(!(await applyRoute())) render();
}
async function loadAll(){
  const r = await rpc('fid_super_overview'); if(!r) return;
  S.today = r.today; S.stores = r.items || []; S.spark = r.spark_total || [];
}
const navBar = right => `<div class="nav"><div class="brand"><span class="logo">${I.logo}</span><span>carimb<span style="color:#FF7B6E">ô</span></span> <span class="crown">Admin</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${right}</div></div>`;

/* ---------- lista ---------- */
const soon = s => (s.status === 'ativa' && s.days_left <= 7) || (s.status === 'trial' && s.days_left <= 3);
function filtered(){
  const q = S.q.trim().toLowerCase();
  return S.stores.filter(s => {
    if(S.filter === 'cancelou' ? !s.cancelled_at : S.filter === 'vencem7' ? !soon(s) : S.filter !== 'todas' && s.status !== S.filter) return false;
    return !q || [s.name, s.email, s.referred_by, s.rep_name].some(v => (v || '').toLowerCase().includes(q));
  });
}
function dueText(s){
  if(s.status === 'bloqueada') return '<span class="dl bad">acesso bloqueado</span>';
  const n = s.days_left;
  if(n > 0) return `<span class="dl ${n <= 7 ? 'warn' : ''}">em ${n} ${pl(n, 'dia', 'dias')}</span>`;
  if(n === 0) return '<span class="dl warn">vence hoje</span>';
  return `<span class="dl bad">venceu há ${-n} ${pl(-n, 'dia', 'dias')}</span>`;
}
const cyclePct = s => Math.max(0, Math.min(100, (1 - s.days_left / Math.max(1, s.plan_days)) * 100));
const progCls = s => s.status === 'vencida' || s.status === 'bloqueada' ? 'bad' : (s.status === 'tolerancia' || s.days_left <= 7 ? 'warn' : '');
function card(s){
  return `<article class="sc s-${s.status}" data-id="${s.id}" tabindex="0">
    <div class="h"><div class="av" style="background:${grad(s.name)}">${esc(ini(s.name))}</div><div class="nm"><b>${esc(s.name)}</b><span>${esc(s.email || '')}</span></div><span class="pill st-${s.status}">${STATUS[s.status]}</span>${s.cancelled_at ? '<span class="pill st-vencida" title="Cancelou a assinatura">Cancelou</span>' : ''}</div>
    <div class="ren"><div class="r1"><span>Renovação</span><b>${fmtDate(s.renews_at)}</b></div><div class="prog ${progCls(s)}"><i style="width:${cyclePct(s)}%"></i></div><div style="margin-top:6px">${dueText(s)}</div></div>

const chW = () => innerWidth < 720 ? Math.max(300, innerWidth - 64) : 640;
const niceMax = v => { if(v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
function colChart(labels, series, o){
  const W = o.w || chW(), H = o.h || 220, L = o.left || 50, R = 8, T = 12, B = 26, n = labels.length, band = (W - L - R) / n, bw = Math.min(44, band * .62);
  const tot = labels.map((_, i) => series.reduce((a, s) => a + Math.max(0, s.vals[i] || 0), 0)), mx = niceMax(Math.max(0, ...tot)), y = v => T + (H - T - B) * (1 - v / mx), fm = o.fmt || brlc;
  let g = '', b = '';
  [0, .5, 1].forEach(f => { const yy = y(mx * f); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${f ? '#EDE7D6' : '#CFC6AE'}"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#3D4C80">${fm(mx * f)}</text>`; });
  const skip = n >= 7 && W < 480 ? 2 : 1;

    series.forEach(s => { const v = Math.max(0, s.vals[i] || 0); if(!v) return; const y1 = y(acc + v), y0 = y(acc); b += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(1, y0 - y1)}" rx="3" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; acc += v; });
    if(i % skip === 0) b += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#3D4C80">${esc(lb)}</text>`;
    b += `<rect class="hv" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent" data-tip="${esc(o.tip(i))}"/>`;

function areaChart(labels, vals, o){

  let t = ''; [0, Math.floor((n - 1) / 2), n - 1].forEach(i => { t += `<text x="${x(i)}" y="${H - 7}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="#3D4C80">${esc(labels[i])}</text>`; });

  const last = vals.length - 1;

const miniSpark = (vals, color = C.kit) => { const n = vals.length, mx = Math.max(1, ...vals), p = vals.map((v, i) => (i / Math.max(1, n - 1) * 70).toFixed(1) + ',' + (20 - v / mx * 18).toFixed(1)).join(' '); return `<svg class="msp" viewBox="0 0 70 22" aria-hidden="true"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`; };

  root.querySelectorAll('[data-s]').forEach(h => { const go = () => { const k = h.dataset.s; S.sort = S.sort.k === k ? {k, d:-S.sort.d} : {k, d:['name', 'status', 'rep', 'ren'].includes(k) ? 1 : -1}; render(false); }; h.onclick = go; h.onkeydown = e => { if(e.key === 'Enter') go(); }; });
  root.querySelectorAll('tr[data-id],[data-oid]').forEach(r => onTap(r, () => openStore(r.dataset.id || r.dataset.oid)));
  $('#pushall').onclick = () => openPush();
}

async function openStore(id){
  const s = S.stores.find(x => x.id === id); if(!s) return;
  S.detail = {s, d:null}; render();
  // a lista pode estar velha (ex.: a loja acabou de pagar): recarrega a loja junto com o detalhe
  const [d] = await Promise.all([rpc('fid_super_store', {p_store:id}), loadAll()]); if(!d) return;
  const fresh = S.stores.find(x => x.id === id) || s;
  if(S.detail && S.detail.s.id === id){ S.detail = {s:fresh, d}; render(false); }
}
async function refreshDetail(){
  const id = S.detail.s.id; await loadAll();
  const s = S.stores.find(x => x.id === id); const d = await rpc('fid_super_store', {p_store:id});
  S.detail = {s, d}; render(false);
}
function bars(rows, lab){
  const max = Math.max(1, ...rows.map(r => r.stamps));
  return `<div class="bars">${rows.map(r => `<i class="${r.stamps ? '' : 'z'}" style="height:${Math.max(2, r.stamps / max * 100)}%" title="${lab(r)}: ${r.stamps} ${pl(r.stamps, 'carimbo', 'carimbos')}"></i>`).join('')}</div>
    <div class="hlab"><span>${lab(rows[0])}</span><span>${lab(rows[rows.length - 1])}</span></div>`;
}
function ring(s){
  const p = cyclePct(s) / 100, R = 46, C = 2 * Math.PI * R, col = s.status === 'ativa' ? '#0E7A47' : s.status === 'trial' ? '#1D4ED8' : s.status === 'tolerancia' ? '#B45309' : '#C0392B';
  const n = s.status === 'bloqueada' ? '—' : Math.abs(s.days_left);
  const lab = s.status === 'bloqueada' ? 'bloqueada' : s.days_left >= 0 ? pl(s.days_left, 'dia', 'dias') + ' p/ renovar' : pl(-s.days_left, 'dia', 'dias') + ' atraso';
  return `<div class="ring"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="${R}" fill="none" stroke="#E4D9C0" stroke-width="9"/><circle cx="56" cy="56" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (s.days_left < 0 ? 1 : p))}"/></svg><div class="c"><div><b>${n}</b><br><small>${lab}</small></div></div></div>`;
}

/* ---------- abas: pedidos, representantes e repasses ---------- */
const TABS = [['lojas', 'Lojas'], ['live', 'Ao vivo'], ['pedidos', 'Pedidos'], ['leads', 'Carrinhos'], ['fin', 'Financeiro'], ['atend', 'Atendimentos'], ['testes', 'Testes'], ['reps', 'Representantes'], ['repasses', 'Repasses'], ['tum', 'Tum']];
const leadPend = l => !l.converted_at && !l.wa_done_at;
const badge = k => k === 'leads' ? S.leads.filter(leadPend).length : k === 'pedidos' ? S.orders.filter(o => o.status === 'pago').length
  : k === 'atend' ? S.tickets.filter(t => t.needs_admin && t.status !== 'resolvido').length
  : k === 'repasses' ? ((S.preview && S.preview.items) || []).filter(i => i.pay).length : 0;
const tabsBar = () => `<div class="tabs" role="tablist">${TABS.map(([k, l]) => { const n = badge(k); return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${n ? `<i>${n}</i>` : ''}</button>`; }).join('')}</div>`;
function bindTabs(){
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = async () => { S.tab = b.dataset.tab; S.repOpen = null; S.repForm = null; render(); await loadTab(); render(false); });
}
async function loadTab(all){
  const jobs = [];
  if(all || S.tab === 'pedidos' || S.tab === 'reps' || S.tab === 'lojas' || S.tab === 'fin') jobs.push(rpc('fid_super_reps').then(r => { if(r && r.items){ S.reps = r.items; S.next = r.next_payday; } }));
  if(all || S.tab === 'atend') jobs.push(rpc('fid_super_tickets').then(r => { if(r && r.items) S.tickets = r.items; }));
  if(all || S.tab === 'testes') jobs.push(rpc('fid_super_trials').then(r => { if(r && r.items) S.trials = r; }));
  if(all || S.tab === 'pedidos') jobs.push(rpc('fid_super_orders').then(r => { if(r && r.items) S.orders = r.items; }));
  if(all || S.tab === 'repasses'){
    jobs.push(rpc('fid_super_cycle_preview').then(r => { if(r && r.items) S.preview = r; }));
    jobs.push(rpc('fid_super_payouts').then(r => { if(r && r.items) S.payouts = r.items; }));
  }
  if(all || S.tab === 'fin') jobs.push(rpc('fid_super_finance', {p_months:S.finMonths}).then(r => { if(r && r.totals) S.fin = r; })); if(all || S.tab === 'fin') jobs.push(rpc('fid_super_fin_stores').then(r => { if(r && r.items) S.finStores = r.items; }));
  if(all || S.tab === 'reps') jobs.push(rpc('fid_super_rep_requests').then(r => { if(r && r.items) S.repReqs = r.items; }));
  if(all || S.tab === 'leads') jobs.push(rpc('fid_super_leads').then(r => { if(r && r.leads) S.leads = r.leads; }));

/* uso do Tum (IA) */
const TUM_PRICE = {in:0.10, out:0.50, cw:0.125, cr:0.01}; // US$ por milhão de tokens (Haiku 5.5, prompts até 100 mil tokens)
const usd = r => ((+r.input_tokens || 0) * TUM_PRICE.in + (+r.output_tokens || 0) * TUM_PRICE.out + (+r.cache_write_tokens || 0) * TUM_PRICE.cw + (+r.cache_read_tokens || 0) * TUM_PRICE.cr) / 1e6;
const allTok = r => (+r.input_tokens || 0) + (+r.output_tokens || 0) + (+r.cache_write_tokens || 0) + (+r.cache_read_tokens || 0);
const fmtUsd = v => 'US$ ' + v.toFixed(v < 1 ? 3 : 2).replace('.', ',');
const fmtN = n => Number(n || 0).toLocaleString('pt-BR');
function viewTum(){
  const T = S.tum;
  if(!T) return {html: heroTab('Carregando…') + '<div class="wrap pad"></div>', bind(){}};
  const t = T.totals, q = +t.questions, cost = usd(t), td = T.today, tokq = q ? Math.round(allTok(t) / q) : 0;
  const mx = Math.max(1, ...T.by_day.map(x => x.questions));
  const bars = T.by_day.map(x => `<i style="height:${Math.max(3, x.questions / mx * 100)}%" class="${x.questions ? '' : 'z'}" title="${fmtDate(x.date)}: ${x.questions}"></i>`).join('');
  const rows = T.by_store.map(r => `<tr><td><b>${esc(r.store)}</b></td><td class="n">${fmtN(r.questions)}</td><td class="n">${fmtN(allTok(r))}</td><td class="n">${fmtUsd(usd(r))}</td><td>${fmtDT(r.last_at)}</td></tr>`).join('');
  const rec = T.recent.map(r => `<tr><td>${fmtDT(r.at)}</td><td>${esc(r.store || '')}</td><td>${esc(r.question || '')}</td><td class="n">${fmtN(r.tokens)}</td></tr>`).join('');
  return {html: heroTab('') + `<div class="wrap pad">
    <div class="bar" style="margin-top:0"><div class="seg" role="group" aria-label="Período">${[7, 30, 90].map(d => `<button data-d="${d}" aria-pressed="${S.tumDays === d}">${d} dias</button>`).join('')}</div>
      <span class="dl" style="margin-left:8px">Custo estimado com o preço do Haiku 5.5 (US$ 0,10 entrada · US$ 0,50 saída por milhão). O valor real está no console da Anthropic.</span></div>
    <div class="tiles">
      <div class="tile"><div class="k">Perguntas</div><b>${fmtN(q)}</b></div><div class="tile"><div class="k">Hoje</div><b>${fmtN(td.questions)}</b></div>
      <div class="tile"><div class="k">Lojas usando</div><b>${fmtN(t.stores)}</b></div><div class="tile"><div class="k">Tokens</div><b>${fmtN(allTok(t))}</b></div>
      <div class="tile"><div class="k">Tokens por pergunta</div><b>${fmtN(tokq)}</b></div><div class="tile"><div class="k">Cache lido</div><b>${fmtN(t.cache_read_tokens)}</b></div>
      <div class="tile"><div class="k">Custo estimado</div><b>${fmtUsd(cost)}</b></div><div class="tile"><div class="k">Por pergunta</div><b>${q ? fmtUsd(cost / q) : '—'}</b></div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <section><h2 class="th">Perguntas por dia</h2><div class="bars">${bars}</div></section>
      <section><h2 class="th">Por loja</h2>${rows ? `<div class="tw"><table><thead><tr><th>Loja</th><th class="n">Perguntas</th><th class="n">Tokens</th><th class="n">Custo</th><th>Último uso</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="sub">Nenhuma pergunta neste período.</p>'}</section>
    </div>
    <h2 class="th" style="margin-top:18px">Últimas perguntas</h2>${rec ? `<div class="tw"><table><thead><tr><th>Quando</th><th>Loja</th><th>Pergunta</th><th class="n">Tokens</th></tr></thead><tbody>${rec}</tbody></table></div>` : '<p class="sub">Nada por aqui ainda.</p>'}</div>`,

/* pedidos */
const OST = {aguardando_pagamento:['tolerancia', 'Aguardando pagamento'], pago:['ativa', 'Pago · enviar kit'], enviado:['trial', 'Enviado'], cancelado:['bloqueada', 'Cancelado'], reembolsado:['vencida', 'Reembolsado']};
const NFC_NAMES = ['Bastão 1', 'Bastão 2'];
/* etiqueta e planilha para o fornecedor */
const ordCode = o => 'CAR-' + String(o.id).replace(/-/g, '').slice(0, 8).toUpperCase();
/* tags: 'kind' vem do banco (nfc ou qr). Lojas antigas têm 2 links NFC (um por bastão) + QR; lojas novas têm 1 link NFC para todos os bastões + QR. */
const isQr = t => t.kind ? t.kind === 'qr' : String(t.label || '').trim().toLowerCase() === 'qr code';
const nfcTags = o => (o.tags || []).filter(t => !isQr(t));
const qrTag = o => (o.tags || []).find(isQr);
const kitWands = o => Number(o.wands) || 2, kitPlates = o => Number(o.plates) || 1;
const kitLabel = o => kitWands(o) + (kitWands(o) === 1 ? ' bastão' : ' bastões') + ' Carimbô + ' + kitPlates(o) + (kitPlates(o) === 1 ? ' placa' : ' placas') + ' Google';
const sharedLink = o => nfcTags(o).length === 1 && kitWands(o) > 1;
const ordBastoes = o => nfcTags(o).map((t, i) => ({n: i + 1, nome: t.label || NFC_NAMES[i] || 'Bastão ' + (i + 1), url: baseUrl() + 'c.html?t=' + t.id}));
const gravarTxt = o => sharedLink(o) ? `*Gravar o MESMO link nos ${kitWands(o)} bastões (NFC Tools):*` : (kitWands(o) === 1 ? '*Gravar no bastão (NFC Tools):*' : '*Gravar em cada bastão (NFC Tools):*');
const ordShippable = o => o.store_id && o.status !== 'aguardando_pagamento' && o.status !== 'cancelado' && (o.tags || []).length;
function labelText(o){
  const B = ordBastoes(o);
  return [`📦 *Pedido ${ordCode(o)}*`, '', `*Enviar para:* ${o.buyer_name}`, `*WhatsApp:* ${o.whatsapp || '—'}`, `*Endereço:* ${o.address || '—'}`, '',
    '*Kit' + (o.kit_name ? ' ' + o.kit_name : '') + ':* ' + kitLabel(o), '', gravarTxt(o),
    ...B.map(b => sharedLink(o) ? `${b.nome}\n${b.url}` : `${b.n}) ${b.nome}\n${b.url}`)].join('\n');
}
async function shareText(text){
  if(navigator.share){ try { await navigator.share({text}); return; } catch(e){ if(e && e.name === 'AbortError') return; } }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}
function listText(L){
  return L.map(labelText).join('\n\n━━━━━━━━━━\n\n');
}
function printLabel(o){
  const B = ordBastoes(o), e = esc;
  const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Etiqueta ${ordCode(o)}</title><style>

function csvDownload(orders, name){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
  const head = ['Pedido', 'Cliente', 'WhatsApp', 'Endereço', 'Entrega', 'Kit', 'Link nº', 'Identificação do link', 'Link para gravar no NFC', 'Bastões que usam este link', 'Placa Google (qtd)'];
  const rows = [];
  orders.forEach(o => ordBastoes(o).forEach(b => rows.push([ordCode(o), o.buyer_name, o.whatsapp, o.address, o.delivery === 'retirada' ? 'Em mãos' : 'Correios', o.kit_name || '', b.n, b.nome, b.url, sharedLink(o) ? kitWands(o) : 1, b.n === 1 ? kitPlates(o) : ''])));
  if(!rows.length) return toast('Nenhum pedido com bastões para exportar', true);
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Planilha baixada ✓ Abra no Excel e mande para o fornecedor');
}

const WA_MSG = n => `Oi, ${String(n || '').split(' ')[0]}! Aqui é o Igor, do Carimbô. Vi que você começou o pedido do kit e não chegou a finalizar. Posso te ajudar com alguma dúvida?`;
function leadEmail(l){
  if(!l.email) return '<span class="dl">Sem e-mail</span>';

  if(l.email_status === 'erro') return '<span class="pill st-vencida">Falhou</span>';

const SLUG = {lojas:'lojas', pedidos:'pedidos', atend:'atendimentos', testes:'testes', reps:'representantes', repasses:'repasses', tum:'tum', fin:'financeiro', live:'aovivo', leads:'carrinhos'};

function syncHash(){ const h = hashFor(); if(location.hash === h) return; try { if(!location.hash) history.replaceState(null, '', h); else history.pushState(null, '', h); } catch(e){} }
function parseRoute(){
  const m = location.hash.match(/^#\/([a-z]+)(?:\/([\w-]+))?/); if(!m) return null;
  const tab = Object.keys(SLUG).find(k => SLUG[k] === m[1]); return tab ? {tab, id:m[2] || null} : null;
}
async function applyRoute(){
  const r = parseRoute(); if(!r) return false;
  S.tab = r.tab; S.detail = null; S.repOpen = null; S.repForm = null;
  if(r.tab === 'lojas' && r.id){
    const st = S.stores.find(x => x.id === r.id);
    if(st){ S.detail = {s:st, d:null}; render(); const [d] = await Promise.all([rpc('fid_super_store', {p_store:r.id}), loadAll()]); if(d && S.detail && S.detail.s.id === r.id){ S.detail = {s:S.stores.find(x => x.id === r.id) || st, d}; render(false); } return true; }

  if(r.tab === 'reps' && r.id){ const rp = S.reps.find(x => x.id === r.id); if(rp) S.repOpen = {id:rp.id, d:null}; }
  render(); await loadTab(); render(false); return true;
}

    <label for="pdest">Para quem</label>
    <select id="pdest"><option value="">Todas as lojas ativas</option>${opts.map(s => `<option value="${esc(s.id)}" ${p.store_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
    <label for="ptit">Título</label><input id="ptit" type="text" maxlength="80" placeholder="Ex.: Novidade no Carimbô" value="${esc(p.title)}">
    <label for="pbod">Mensagem</label><textarea id="pbod" rows="4" maxlength="500" placeholder="Escreva o aviso...">${esc(p.body)}</textarea>
    <label for="plnk">Link (opcional)</label><input id="plnk" type="text" maxlength="200" placeholder="Ex.: /lojista#/campanhas" value="${esc(p.link)}">
    <div class="acts" style="margin-top:16px;justify-content:flex-end"><button class="btn line" id="pcancel" type="button">Cancelar</button><button class="btn" id="psend" type="button">Enviar</button></div>
  </div></div>`;
  $('#pdest').onchange = e => { S.push.store_id = e.target.value; const s = opts.find(x => x.id === e.target.value); S.push.store_name = s ? s.name : ''; };
  $('#ptit').oninput = e => S.push.title = e.target.value;
  $('#pbod').oninput = e => S.push.body = e.target.value;
  $('#plnk').oninput = e => S.push.link = e.target.value;
  $('#pcancel').onclick = () => { S.push = null; renderPush(); };
  $('#pov').onclick = e => { if(e.target.id === 'pov'){ S.push = null; renderPush(); } };
  $('#psend').onclick = async () => {
    const title = $('#ptit').value.trim(), body = $('#pbod').value.trim(), link = $('#plnk').value.trim(), store_id = $('#pdest').value;
    if(!title || !body){ toast('Preencha título e mensagem.', true); return; }
    const alvo = store_id ? (opts.find(x => x.id === store_id) || {}).name : `todas as ${opts.filter(s => s.status !== 'bloqueada').length} lojas ativas`;
    if(!confirm(`Enviar para ${alvo}?\n\n"${title}" — ${body}`)) return;
    $('#psend').disabled = true;
    const {data, error} = await sb.functions.invoke('notify', {body:{title, body, link, store_id: store_id || undefined}});
    $('#psend').disabled = false;
    if(error || !data || data.error){ toast('Não foi possível enviar: ' + (data && data.error || 'erro'), true); return; }
    S.push = null; renderPush();
    toast(`Aviso enviado ✓ ${data.stores} ${pl(data.stores, 'loja', 'lojas')} · ${data.push_sent} ${pl(data.push_sent, 'notificação', 'notificações')} no celular.`);
  };
}
function render(top = true){
  render0(top); labelCells(); renderPush();
}
function render0(top = true){
  syncHash();
  if(S.detail){ const v = viewDetail(); root.innerHTML = v.html; v.bind(); if(top) window.scrollTo(0, 0); }
  else if(S.tab !== 'lojas'){ viewTab(); if(top) window.scrollTo(0, 0); }
  else { viewList(); }
}
boot();
</script>
</body>
</html>
