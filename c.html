<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Cartão fidelidade</title>
<style>
  :root{--c:#7c3aed;--bg:#f6f4fb;--ink:#1c1530;--mut:#6b6485}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  main{width:100%;max-width:420px;padding:20px 16px 40px}
  .store{background:var(--c);color:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 10px 30px -10px var(--c)}
  .store h1{margin:0 0 2px;font-size:1.25rem}
  .store p{margin:0;opacity:.85;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
  .dot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;transition:transform .3s}
  .dot.on{background:#fff;color:var(--c);transform:scale(1.04)}
  .dot.pop{animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1.04)}}
  .msg{margin:18px 4px 6px;font-size:1.15rem;font-weight:700;text-align:center}
  .sub{margin:0 4px;text-align:center;color:var(--mut);font-size:.92rem}
  form,.box{background:#fff;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
  input{width:100%;padding:13px 14px;border:1.5px solid #ddd6ee;border-radius:12px;font-size:1rem;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--c)}
  button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--c);color:#fff;font-size:1.02rem;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--c);border:1.5px solid var(--c)}
  button:disabled{opacity:.6}
  .reward{background:#fff8e1;border:1.5px solid #f5c542;border-radius:18px;padding:16px;margin-top:18px;text-align:center}
  .reward b{display:block;font-size:1.05rem;margin-bottom:4px}
  a.link{display:block;text-align:center;margin-top:16px;color:var(--mut);font-size:.85rem}
  .hide{display:none}
  .err{color:#b42318;text-align:center;margin-top:14px}
</style>
</head>
<body>
<main id="app"><p class="sub" style="margin-top:40vh">Carregando…</p></main>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const tag = new URLSearchParams(location.search).get('t') || '';
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const app = document.getElementById('app');
const KEY = 'fid_token_' + tag;
let INFO = null;
const store = k => { try { return localStorage.getItem(k) } catch(e){ return null } };
const save = (k,v) => { try { localStorage.setItem(k,v) } catch(e){} };
const rpc = async (fn, args) => { const {data,error} = await sb.rpc(fn,args); if(error) return {error:error.message}; return data; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function boom(big){
  const end = Date.now() + (big?2500:1200);
  const colors = ['#7c3aed','#f59e0b','#10b981','#ef4444','#3b82f6','#ec4899'];
  (function f(){
    confetti({particleCount:big?9:5,angle:60,spread:70,origin:{x:0,y:.7},colors});
    confetti({particleCount:big?9:5,angle:120,spread:70,origin:{x:1,y:.7},colors});
    if(Date.now()<end) requestAnimationFrame(f);
  })();
  confetti({particleCount:big?220:120,spread:100,origin:{y:.55},colors});
  try{ navigator.vibrate && navigator.vibrate(big?[120,60,120,60,200]:120) }catch(e){}
}

function card(s, justStamped){
  const goal = s.goal, dots = [];
  for(let i=0;i<goal;i++) dots.push(`<div class="dot ${i<s.stamps?'on':''} ${justStamped&&i===s.stamps-1?'pop':''}">${i<s.stamps?'★':''}</div>`);
  return `<div class="store" style="--c:${esc(s.color)};background:${esc(s.color)}">
    <h1>${esc(s.store)}</h1><p>${esc(s.name?('Olá, '+s.name.split(' ')[0]):'Cartão fidelidade')} · ${s.stamps}/${goal}</p>
    <div class="grid" style="grid-template-columns:repeat(${goal<=5?goal:5},1fr)">${dots.join('')}</div></div>`;
}

function setColor(c){ document.documentElement.style.setProperty('--c', c||'#7c3aed'); }

async function showRegister(info){
  setColor(info.color);
  app.innerHTML = `<div class="store" style="background:${esc(info.color)}"><h1>${esc(info.store)}</h1>
    <p>Junte ${info.goal} carimbos e ganhe: ${esc(info.reward)}</p></div>
    <form id="f"><label>Seu nome</label><input name="n" autocomplete="name" required>
    <label>Seu WhatsApp (com DDD)</label><input name="w" inputmode="tel" autocomplete="tel" placeholder="11 99999-9999" required>
    <button>Começar meu cartão</button><p class="err hide" id="e"></p></form>
    <a class="link" href="#" id="rec">Já tenho cartão (recuperar pelo WhatsApp)</a>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault(); const b = ev.target.querySelector('button'); b.disabled = true;
    const r = await rpc('fid_register',{p_tag:tag,p_name:ev.target.n.value,p_whatsapp:ev.target.w.value});
    if(r.error){ const e=document.getElementById('e'); e.textContent='Confira nome e WhatsApp (com DDD).'; e.classList.remove('hide'); b.disabled=false; return; }
    save(KEY, r.token); stampNow(r.token);
  };
  document.getElementById('rec').onclick = async ev => {
    ev.preventDefault();
    const w = prompt('Digite o WhatsApp cadastrado (com DDD):'); if(!w) return;
    const r = await rpc('fid_recover',{p_tag:tag,p_whatsapp:w});
    if(r.error){ alert('Não encontramos esse número.'); return; }
    save(KEY, r.token); stampNow(r.token);
  };
}

function render(s, opts={}){
  setColor(s.color);
  let h = card(s, opts.stamped);
  if(opts.stamped && opts.earned) h += `<p class="msg">🎉 Você ganhou: ${esc(s.reward)}!</p><p class="sub">Mostre esta tela ao atendente.</p>`;
  else if(opts.stamped) h += `<p class="msg">Carimbo registrado!</p><p class="sub">Faltam ${s.goal-s.stamps} para ganhar: ${esc(s.reward)}</p>`;
  else if(opts.note) h += `<p class="msg">${esc(opts.note)}</p>${opts.sub?`<p class="sub">${esc(opts.sub)}</p>`:''}${opts.retry?'<button id="retry" class="ghost">Tentar de novo</button>':''}`;
  else if(opts.wait) { const m=Math.ceil(opts.wait/60); h += `<p class="msg">Carimbo recente 😉</p><p class="sub">O próximo carimbo libera em ${m} min.</p>`; }
  else h += `<p class="sub" style="margin-top:18px">Faltam ${s.goal-s.stamps} para ganhar: ${esc(s.reward)}</p>${opts.viewOnly?'<p class="sub" style="margin-top:6px">Para ganhar um carimbo, encoste o celular no bastão.</p>':''}`;
  if(s.rewards_available>0) h += `<div class="reward"><b>🎁 ${s.rewards_available} prêmio(s) disponível(is)</b>${esc(s.reward)}<button id="rd">Resgatar agora (atendente confirma)</button></div>`;
  app.innerHTML = h;
  const rt = document.getElementById('retry');
  if(rt) rt.onclick = () => stampNow(s.token);
  const rd = document.getElementById('rd');
  if(rd) rd.onclick = async () => {
    if(!confirm('Atendente: confirmar resgate de "'+s.reward+'"?')) return;
    const r = await rpc('fid_redeem',{p_tag:tag,p_token:s.token});
    if(r.redeemed){ boom(true); render(r,{}); } else render(r,{});
  };
}

async function stampNow(token){
  const args = {p_tag:tag,p_token:token};
  if(INFO && INFO.geo_required){
    app.innerHTML = '<p class="sub" style="margin-top:40vh">Confirmando que você está na loja…</p>';
    const p = await getPos();
    if(p.err){
      return render({token,stamps:0,goal:INFO.goal,reward:INFO.reward,store:INFO.store,color:INFO.color,name:'',rewards_available:0},
        {note:'Precisamos confirmar que você está na loja',sub:'Permita o acesso à localização no navegador e toque em tentar de novo.',retry:true});
    }
    args.p_lat = p.lat; args.p_lng = p.lng; args.p_acc = p.acc;
  }
  const r = await rpc('fid_stamp',args);
  if(r.error){ app.innerHTML = '<p class="err">Cartão não encontrado. <a href="">Tentar de novo</a></p>'; return; }
  if(r.stamped){ render(r,{stamped:true,earned:r.earned}); boom(r.earned); }
  else if(r.geo === 'far') render(r,{note:'Você precisa estar na loja para carimbar',sub:'Você está a cerca de '+r.distance_m+' m. Chegue ao balcão e tente de novo.',retry:true});
  else if(r.geo === 'needed') render(r,{note:'Precisamos confirmar que você está na loja',sub:'Permita o acesso à localização e tente de novo.',retry:true});
  else if(r.daily_limit) render(r,{note:'Limite de carimbos de hoje atingido',sub:'Volte amanhã para continuar juntando 😉'});
  else render(r,{wait:r.wait_seconds});
}

function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({err:'unsupported'});
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>res({err:e.code===1?'denied':'fail'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  });
}

(async function init(){
  if(!tag){ app.innerHTML = '<p class="err">Tag inválida. Encoste o celular no bastão novamente.</p>'; return; }
  const info = await rpc('fid_get_store',{p_tag:tag});
  if(!info || info.error){ app.innerHTML = '<p class="err">Esta tag não está ativa.</p>'; return; }
  INFO = info;
  const token = store(KEY);
  if(!token) return showRegister(info);
  const st = await rpc('fid_state',{p_tag:tag,p_token:token});
  if(st.error){ return showRegister(info); }
  // Só carimba em abertura nova (toque no bastão ou link aberto). Recarregar (F5/puxar para atualizar),
  // voltar/avançar ou aba restaurada só mostram o cartão, sem carimbar.
  let navType = 'navigate';
  try { const n = performance.getEntriesByType('navigation')[0]; if(n) navType = n.type; } catch(e){}
  if(navType === 'reload' || navType === 'back_forward') return render(st,{viewOnly:true});
  stampNow(token);
})();

// Página restaurada do cache do navegador (botão voltar): não carimba, só mostra.
window.addEventListener('pageshow', e => { if(e.persisted){ const t = store(KEY); if(t) rpc('fid_state',{p_tag:tag,p_token:t}).then(s=>{ if(!s.error) render(s,{viewOnly:true}); }); } });
</script>
</body>
</html>
