<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14296B">
<title>Carimbô · seu cartão</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14296B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--c:#14296B;--bg:#FBF7EE;--ink:#14296B;--mut:#3D4C80;--red:#E03A2F;--kraft:#EAD9B6}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  h1,.msg,button,.cd,.brand{font-family:'Fredoka','Nunito',system-ui,sans-serif}
  main{width:100%;max-width:420px;margin:0 auto;padding:20px 16px 12px}
  .brand{max-width:420px;margin:0 auto;padding:6px 16px 32px;text-align:center;font-weight:700;font-size:1.05rem;color:var(--ink);opacity:.8}
  .brand span{color:var(--red)}
  .store{background:var(--c);color:#fff;border:3px solid #14296B;border-radius:24px;padding:22px 20px;box-shadow:6px 6px 0 #14296B}
  .store h1{margin:0 0 2px;font-size:1.35rem;font-weight:700}
  .store p{margin:0;opacity:.9;font-size:.95rem}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
  .dot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;transition:transform .3s}
  .dot.on{transform:scale(1.04)}
  .dot svg{width:66%;height:66%}
  .dot.pop{animation:pop .6s}
  @keyframes pop{0%{transform:scale(.3) rotate(-12deg)}60%{transform:scale(1.3) rotate(4deg)}100%{transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){.dot.pop{animation:none}}
  .msg{margin:20px 4px 6px;font-size:1.3rem;font-weight:700;text-align:center}
  .sub{margin:0 4px;text-align:center;color:var(--mut);font-size:.95rem}
  form,.box{background:#fff;border:3px solid #14296B;border-radius:20px;padding:18px;margin-top:20px;box-shadow:5px 5px 0 #14296B}
  label{display:block;font-size:.85rem;font-weight:700;color:var(--ink);margin:10px 0 4px}
  input{width:100%;padding:13px 14px;border:3px solid #14296B;border-radius:14px;font-size:1rem;font-family:inherit;background:var(--bg);color:var(--ink)}
  input:focus{outline:none;border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
  button{width:100%;margin-top:14px;padding:14px;border:3px solid #14296B;border-radius:14px;background:var(--red);color:#fff;font-size:1.2rem;font-weight:600;cursor:pointer;box-shadow:4px 4px 0 #14296B;transition:transform .08s,box-shadow .08s}
  button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #14296B}
  button.ghost{background:#fff;color:var(--ink)}
  button:disabled{opacity:.6}
  .reward{background:var(--kraft);border:3px solid #14296B;border-radius:20px;padding:16px;margin-top:20px;text-align:center;box-shadow:5px 5px 0 #14296B}
  .reward b{display:block;font-size:1.15rem;margin-bottom:4px;font-family:'Fredoka',sans-serif;font-weight:600}
  a.link{display:block;text-align:center;margin-top:18px;color:var(--mut);font-size:.9rem;font-weight:600}
  .hide{display:none}
  .dot .ic{font-size:1.35rem;line-height:1}
  .lks b{display:block;font-size:1.05rem;font-family:'Fredoka',sans-serif;font-weight:600}
  .lkrow{display:grid;gap:10px;margin-top:12px}
  .lk{display:flex;align-items:center;gap:10px;width:100%;margin:0;padding:11px 14px;background:#fff;color:var(--ink);border:3px solid #14296B;border-radius:14px;font-family:'Nunito',sans-serif;font-size:.98rem;font-weight:700;text-align:left;box-shadow:3px 3px 0 #14296B}
  .lk svg{width:22px;height:22px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .lk span{flex:1}
  .lk em{font-style:normal;font-size:.8rem;font-weight:700;color:#fff;background:var(--red);border-radius:99px;padding:3px 10px}
  .lk em.ok{background:#CDEBD9;color:#0E4A2D}
  .reward.prize,.reward.pend{background:#fff}
  .reward.ok{background:#CDEBD9}
  .cd{font-weight:600;margin:8px 0 0}
  .err{color:#B42318;text-align:center;margin-top:14px;font-weight:600}
</style>
</head>
<body>
<main id="app"><p class="sub" style="margin-top:40vh">Carregando…</p></main>
<div class="brand">carimb<span>ô</span></div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const tag = new URLSearchParams(location.search).get('t') || '';
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const app = document.getElementById('app');
const KEY = 'fid_token_' + tag;
let INFO = null;
const store = k => { try { return localStorage.getItem(k) } catch(e){ return null } };
const save = (k,v) => { try { localStorage.setItem(k,v) } catch(e){} };
const rpc = async (fn, args) => { const {data,error} = await sb.rpc(fn,args); if(error) return {error:error.message}; return data; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function boom(big){
  const end = Date.now() + (big?2500:1200);
  const colors = ['#14296B','#E03A2F','#EAD9B6','#FBF7EE','#FFC83D'];
  (function f(){
    confetti({particleCount:big?9:5,angle:60,spread:70,origin:{x:0,y:.7},colors});
    confetti({particleCount:big?9:5,angle:120,spread:70,origin:{x:1,y:.7},colors});
    if(Date.now()<end) requestAnimationFrame(f);
  })();
  confetti({particleCount:big?220:120,spread:100,origin:{y:.55},colors});
  try{ navigator.vibrate && navigator.vibrate(big?[120,60,120,60,200]:120) }catch(e){}
}

const hx = h => { h = String(h||'').replace('#',''); if(h.length!==6) h='14296B'; return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
const lum = h => { const [r,g,b] = hx(h); return (0.299*r+0.587*g+0.114*b)/255; };
const rgba = (h,a) => { const [r,g,b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
const stampSvg = c => `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="22" r="13" fill="${c}"/><rect x="44" y="30" width="12" height="26" fill="${c}"/><rect x="22" y="54" width="56" height="16" rx="6" fill="${c}"/><rect x="14" y="78" width="72" height="9" rx="4.5" fill="#E03A2F"/></svg>`;
function card(s, justStamped){
  const goal = s.goal, dots = [], bg = s.color || '#14296B', sc = s.stamp_color || '#FBF7EE', icon = s.icon || 'star';
  const fg = lum(bg) > .62 ? '#14296B' : '#ffffff';
  const starCol = lum(sc) > .62 ? (lum(bg) < .62 ? bg : '#14296B') : '#ffffff';
  const dark = lum(sc) <= .62;
  for(let i=0;i<goal;i++){
    const on = i<s.stamps, pop = justStamped && i===s.stamps-1 ? 'pop' : '';
    const fs = (1.3*(s.scale||100)/100).toFixed(2)+'rem';
    const glyph = icon==='star' ? (on?stampSvg(dark?'#FBF7EE':'#14296B'):'') : `<span class="ic" style="font-size:${fs};${on?'':'opacity:.3;filter:grayscale(1)'}">${esc(icon)}</span>`;
    dots.push(`<div class="dot ${on?'on':''} ${pop}" style="${on?`background:${esc(sc)};color:${starCol}`:`background:transparent;border:2.5px dashed ${rgba(fg,.5)}`}">${glyph}</div>`);
  }
  return `<div class="store" style="background:${esc(bg)};color:${fg}">
    <h1>${esc(s.store)}</h1><p>${esc(s.name?('Olá, '+s.name.split(' ')[0]):'Cartão fidelidade')} · ${s.stamps}/${goal}</p>
    <div class="grid" style="grid-template-columns:repeat(${goal<=5?goal:5},1fr)">${dots.join('')}</div></div>`;
}

const LKICON = {
  whatsapp:'<svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.1A8 8 0 1 1 8.2 19z"/><path d="M9 8.5c.3 2.6 2.4 4.7 5 5l1.2-1.2-1.8-1-.8.7c-.9-.4-1.6-1.1-2-2l.7-.8-1-1.8z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v7h4v-7h3l1-4h-4V8z"/></svg>',
  site:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  google:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>'
};
const LKNAME = {whatsapp:'Falar no WhatsApp', instagram:'Instagram', facebook:'Facebook', site:'Nosso site', google:'Avaliar no Google'};
function linksBox(s){
  const L = s.links || {}, keys = ['whatsapp','instagram','facebook','site','google'].filter(k => L[k]);
  if(!keys.length) return '';
  const open = keys.some(k => L[k].bonus && !L[k].done);
  return `<div class="box lks"><b>${open ? 'Quer nos apoiar e ganhar mais carimbos?' : 'Fique perto da gente'}</b>
    ${open ? '<p class="sub" style="margin:4px 0 0;text-align:left">Toque, abra a página e volte aqui: o carimbo bônus cai no seu cartão. Vale uma vez por rede.</p>' : ''}
    <div class="lkrow">${keys.map(k => `<button type="button" class="lk" data-lk="${k}" data-url="${esc(L[k].url)}">${LKICON[k]}<span>${LKNAME[k]}</span>${L[k].done ? '<em class="ok">✓ ganhou</em>' : L[k].bonus ? '<em>+1 carimbo</em>' : ''}</button>`).join('')}</div></div>`;
}
const CKEY = () => 'fid_claim_' + tag;
function bindLinks(s){
  document.querySelectorAll('[data-lk]').forEach(b => b.onclick = () => {
    const k = b.dataset.lk, L = (s.links||{})[k];
    try { window.open(b.dataset.url, '_blank', 'noopener'); } catch(e){}
    if(L && L.bonus && !L.done) save(CKEY(), JSON.stringify({k, ts:Date.now()}));
  });
}
async function checkClaim(){
  let p = null; try { p = JSON.parse(store(CKEY()) || 'null'); } catch(e){}
  if(!p) return;
  const wait = 5000 - (Date.now() - p.ts);
  if(wait > 0) return setTimeout(checkClaim, wait + 50);
  try { localStorage.removeItem(CKEY()); } catch(e){}
  const tk = store(KEY); if(!tk) return;
  const r = await rpc('fid_claim',{p_tag:tag,p_token:tk,p_kind:p.k});
  if(r && r.claimed){ render(r,{viewOnly:true,bonus:true}); boom(!!r.earned); }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkClaim(); });

function setColor(c){
  c = c || '#14296B';
  // acento legível: se o fundo escolhido for claro, escurece para usar em textos e bordas
  if(lum(c) > .55){ c = '#' + hx(c).map(v => Math.round(v*.45).toString(16).padStart(2,'0')).join(''); }
  document.documentElement.style.setProperty('--c', c);
}

async function showRegister(info){
  setColor(info.color);
  app.innerHTML = `<div class="store" style="background:${esc(info.color)}"><h1>${esc(info.store)}</h1>
    <p>Junte ${info.goal} carimbos e ganhe: ${esc(info.reward)}</p></div>
    <form id="f"><label>Seu nome</label><input name="n" autocomplete="name" required>
    <label>Seu WhatsApp (com DDD)</label><input name="w" inputmode="tel" autocomplete="tel" placeholder="11 99999-9999" required>
    <button>Começar meu cartão</button><p class="err hide" id="e"></p></form>
    <a class="link" href="#" id="rec">Já tenho cartão (recuperar pelo WhatsApp)</a>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault(); const b = ev.target.querySelector('button'); b.disabled = true;
    const r = await rpc('fid_register',{p_tag:tag,p_name:ev.target.n.value,p_whatsapp:ev.target.w.value});
    if(r.error){ const e=document.getElementById('e'); e.textContent='Confira nome e WhatsApp (com DDD).'; e.classList.remove('hide'); b.disabled=false; return; }
    save(KEY, r.token); stampNow(r.token);
  };
  document.getElementById('rec').onclick = async ev => {
    ev.preventDefault();
    const w = prompt('Digite o WhatsApp cadastrado (com DDD):'); if(!w) return;
    const r = await rpc('fid_recover',{p_tag:tag,p_whatsapp:w});
    if(r.error){ alert('Não encontramos esse número.'); return; }
    save(KEY, r.token); stampNow(r.token);
  };
}

function render(s, opts={}){
  setColor(s.color);
  let h = card(s, opts.stamped);
  if(opts.stamped && opts.earned) h += `<p class="msg">🎉 Você ganhou: ${esc(s.reward)}!</p><p class="sub">Mostre esta tela ao atendente.</p>`;
  else if(opts.stamped) h += `<p class="msg">Tum! Carimbo batido!</p><p class="sub">Faltam ${s.goal-s.stamps} para ganhar: ${esc(s.reward)}</p>`;
  else if(opts.bonus) h += `<p class="msg">🎉 Carimbo bônus!</p><p class="sub">Obrigado por apoiar a ${esc(s.store)}.</p>`;
  else if(opts.note) h += `<p class="msg">${esc(opts.note)}</p>${opts.sub?`<p class="sub">${esc(opts.sub)}</p>`:''}${opts.retry?'<button id="retry" class="ghost">Tentar de novo</button>':''}`;
  else if(opts.wait) { const m=Math.ceil(opts.wait/60); h += `<p class="msg">Carimbo recente 😉</p><p class="sub">O próximo carimbo libera em ${m} min.</p>`; }
  else h += `<p class="sub" style="margin-top:18px">Faltam ${s.goal-s.stamps} para ganhar: ${esc(s.reward)}</p>${opts.viewOnly?'<p class="sub" style="margin-top:6px">Para ganhar um carimbo, encoste o celular no bastão.</p>':''}`;
  if(s.pending){
    h += `<div class="reward pend"><b>⏳ Resgate pendente</b>${esc(s.reward)}<p class="sub" style="margin-top:6px">Vá até a loja para retirar seu prêmio.</p>
      <p class="cd">Expira em <span id="cd"></span></p><button id="pr">Apresentar no balcão</button></div>`;
  } else if(s.rewards_available>0){
    h += `<div class="reward prize"><b>🎁 ${s.rewards_available>1?'Você tem '+s.rewards_available+' prêmios':'Você ganhou um prêmio!'}</b>${esc(s.reward)}
      <p class="sub" style="margin-top:6px">Ao resgatar, você tem ${s.valid_days||7} dia(s) para retirar na loja.</p>
      <button id="rd">Resgatar agora</button></div>`;
  } else if(s.last_expired){
    h += `<p class="sub" style="margin-top:14px">Seu último prêmio expirou 😕 Continue juntando carimbos para ganhar outro!</p>`;
  }
  h += linksBox(s);
  app.innerHTML = h;
  bindLinks(s);
  const rt = document.getElementById('retry');
  if(rt) rt.onclick = () => stampNow(s.token);
  const rd = document.getElementById('rd');
  if(rd) rd.onclick = async () => {
    rd.disabled = true;
    const r = await rpc('fid_redeem',{p_tag:tag,p_token:s.token});
    if(r.error){ rd.disabled=false; alert('Não foi possível resgatar. Tente de novo.'); return; }
    render(r,{viewOnly:true});
  };
  const pr = document.getElementById('pr');
  if(pr) pr.onclick = () => present(s);
  if(s.pending) startCountdown(s, document.getElementById('cd'), () => refresh());
}

let timers = [];
function clearTimers(){ timers.forEach(clearInterval); timers = []; }
function fmtLeft(sec){
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60), x = sec%60;
  if(d>0) return d+'d '+h+'h';
  if(h>0) return h+'h '+String(m).padStart(2,'0')+'min';
  return m+'min '+String(x).padStart(2,'0')+'s';
}
function startCountdown(s, el, onEnd){
  clearTimers();
  const end = Date.now() + s.pending.seconds_left*1000;
  const tick = () => { const left = Math.max(0, Math.round((end-Date.now())/1000)); if(el) el.textContent = fmtLeft(left); if(left<=0){ clearTimers(); onEnd(); } };
  tick(); timers.push(setInterval(tick,1000));
  // enquanto pendente, confere de tempos em tempos se o atendente já validou
  timers.push(setInterval(async()=>{ const n = await rpc('fid_state',{p_tag:tag,p_token:s.token}); if(!n.error && !n.pending) refresh(s); }, 6000));
}
async function refresh(prev){
  clearTimers();
  const n = await rpc('fid_state',{p_tag:tag,p_token:store(KEY)});
  if(n.error) return;
  if(prev && prev.pending && !n.pending && n.rewards_redeemed > prev.rewards_redeemed) return done(n);
  render(n,{viewOnly:true});
}
function done(s){
  clearTimers(); setColor(s.color);
  app.innerHTML = card(s,false) + `<div class="reward ok"><b>✅ Prêmio entregue!</b>${esc(s.reward)}<p class="sub" style="margin-top:6px">Obrigado pela visita! Seus novos carimbos já podem começar.</p><button id="back">Voltar ao cartão</button></div>`;
  boom(true);
  document.getElementById('back').onclick = () => render(s,{viewOnly:true});
}
function present(s){
  setColor(s.color);
  app.innerHTML = `<div class="store" style="background:${esc(s.color)};text-align:center"><p>Apresente ao atendente</p><h1 style="font-size:1.5rem;margin:6px 0">${esc(s.reward)}</h1>
    <p>${esc(s.store)} · ${esc(s.name)}</p><p style="margin-top:16px">Expira em <b id="cd"></b></p></div>
    <p class="sub" style="margin-top:18px">O atendente confere seu nome e confirma a entrega pelo painel da loja. Esta tela atualiza sozinha.</p>
    <button class="ghost" id="bk">Voltar</button>`;
  startCountdown(s, document.getElementById('cd'), () => refresh(s));
  document.getElementById('bk').onclick = () => render(s,{viewOnly:true});
}

async function stampNow(token){
  const args = {p_tag:tag,p_token:token};
  if(INFO && INFO.geo_required){
    app.innerHTML = '<p class="sub" style="margin-top:40vh">Confirmando que você está na loja…</p>';
    const p = await getPos();
    if(p.err){
      return render({token,stamps:0,goal:INFO.goal,reward:INFO.reward,store:INFO.store,color:INFO.color,name:'',rewards_available:0},
        {note:'Precisamos confirmar que você está na loja',sub:'Permita o acesso à localização no navegador e toque em tentar de novo.',retry:true});
    }
    args.p_lat = p.lat; args.p_lng = p.lng; args.p_acc = p.acc;
  }
  const r = await rpc('fid_stamp',args);
  if(r.error){ app.innerHTML = '<p class="err">Cartão não encontrado. <a href="">Tentar de novo</a></p>'; return; }
  if(r.stamped){ render(r,{stamped:true,earned:r.earned}); boom(r.earned); }
  else if(r.geo === 'far') render(r,{note:'Você precisa estar na loja para carimbar',sub:'Você está a cerca de '+r.distance_m+' m. Chegue ao balcão e tente de novo.',retry:true});
  else if(r.geo === 'needed') render(r,{note:'Precisamos confirmar que você está na loja',sub:'Permita o acesso à localização e tente de novo.',retry:true});
  else if(r.suspended) render(r,{note:'Esta loja não está carimbando agora',sub:'Fale com o atendente. Seus carimbos e prêmios continuam guardados.'});
  else if(r.daily_limit) render(r,{note:'Limite de carimbos de hoje atingido',sub:'Volte amanhã para continuar juntando 😉'});
  else render(r,{wait:r.wait_seconds});
}

function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({err:'unsupported'});
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>res({err:e.code===1?'denied':'fail'}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  });
}

(async function init(){
  setTimeout(checkClaim, 1500);
  if(!tag){ app.innerHTML = '<p class="err">Tag inválida. Encoste o celular no bastão novamente.</p>'; return; }
  const info = await rpc('fid_get_store',{p_tag:tag});
  if(!info || info.error){ app.innerHTML = '<p class="err">Esta tag não está ativa.</p>'; return; }
  INFO = info;
  const token = store(KEY);
  if(!token) return showRegister(info);
  const st = await rpc('fid_state',{p_tag:tag,p_token:token});
  if(st.error){ return showRegister(info); }
  // Só carimba em abertura nova (toque no bastão ou link aberto). Recarregar (F5/puxar para atualizar),
  // voltar/avançar ou aba restaurada só mostram o cartão, sem carimbar.
  let navType = 'navigate';
  try { const n = performance.getEntriesByType('navigation')[0]; if(n) navType = n.type; } catch(e){}
  if(navType === 'reload' || navType === 'back_forward') return render(st,{viewOnly:true});
  stampNow(token);
})();

// Página restaurada do cache do navegador (botão voltar): não carimba, só mostra.
