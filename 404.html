<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada · Carimbô</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
:root{--paper:#FBF7EE;--ink:#14296B;--red:#E03A2F;--kraft:#EAD9B6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif}
main{width:min(100%,440px);background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:30px 26px;text-align:center}
img{width:56px;height:56px;border-radius:14px}
h1{margin:14px 0 6px;font-size:1.7rem;line-height:1.15}
p{margin:0 0 20px;line-height:1.5}
.n{display:inline-block;background:var(--kraft);border:2px dashed var(--ink);border-radius:12px;padding:4px 14px;font-weight:800;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
a.b{display:inline-block;padding:12px 20px;border:2.5px solid var(--ink);border-radius:12px;font-weight:800;text-decoration:none;color:var(--ink);background:#fff}
a.b.p{background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink)}
a.b:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style></head>
<body><main>
<img src="/icons/icon-192.png" alt="">
<div><span class="n">404</span></div>
<h1>Página não encontrada</h1>
<p>O endereço pode estar errado ou a página mudou de lugar.</p>
<div class="row"><a class="b p" href="/">Ir para o início</a><a class="b" href="/lojista">Entrar no painel</a></div>
</main></body></html>
