<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}

  /* ===== Carrossel de segmentos (topo da página) ===== */
  .sg{--ink:#14296B;--ink-deep:#0E1E52;--ink-lift:#223F94;--red-deep:#9E231B;--paper-mut:#C9D2F0;--kraft:#EAD9B6}
  .sg button{font-family:inherit}
  .sg :focus-visible{outline:3px solid var(--kraft);outline-offset:3px}
  .sg::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:radial-gradient(circle at 12px 14px,var(--paper) 9px,transparent 9.5px) 0 0/24px 14px repeat-x;pointer-events:none}
  .sg{position:relative;overflow:hidden;color:var(--paper);background:radial-gradient(1100px 520px at 50% 38%,var(--ink-lift) 0%,var(--ink) 55%,var(--ink-deep) 100%);padding-block:34px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(251,247,238,.09) 1.5px,transparent 1.7px);background-size:24px 24px;pointer-events:none}
  .sg-wrap{position:relative;max-width:1240px;margin:0 auto}
  .sg-head{text-align:center;max-width:820px;margin:0 auto}
  .sg-kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--kraft)}
    .sg-h{margin:0;font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:clamp(28px,4.6vw,50px);line-height:1.1;text-wrap:balance}
  .sg-h .sg-hl{background:linear-gradient(transparent 64%,rgba(224,58,47,.92) 64% 92%,transparent 92%);padding:0 .08em}
  .sg-lead{margin:14px auto 0;max-width:600px;font-size:clamp(16px,1.9vw,19px);line-height:1.5;color:var(--paper-mut)}

  /* palco do carrossel */
  .sg-stage{position:relative;height:calc(var(--ch,340px) + 64px);margin-top:18px;perspective:1500px;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:-6px}
  .sg-glow{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;filter:blur(96px);opacity:.5;background-color:#8FB4FF;transition:background-color .9s ease;pointer-events:none}
  .sg-track{position:absolute;inset:0;transform-style:preserve-3d}
  .sg-card{position:absolute;left:50%;top:50%;width:var(--cw,260px);height:var(--ch,340px);margin:calc(var(--ch,340px)/-2) 0 0 calc(var(--cw,260px)/-2);display:flex;flex-direction:column;background:var(--c);border:3px solid var(--ink-deep);border-radius:22px;box-shadow:6px 7px 0 rgba(8,16,48,.55);overflow:hidden;transition:transform .75s cubic-bezier(.22,1,.36,1),opacity .5s ease,filter .5s ease;will-change:transform,opacity;cursor:pointer}

  .sg-art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 14px 0}

  .sg-nm{margin:0;font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:clamp(19px,2.1vw,23px);line-height:1.1;color:var(--ink-deep);text-align:center;text-wrap:balance}

  @keyframes sg-pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.35)}100%{transform:scale(1) rotate(0);opacity:1}}

  .sg-nav{position:absolute;top:50%;z-index:40;width:54px;height:54px;margin-top:-27px;border-radius:50%;background:var(--paper);border:3px solid var(--ink-deep);box-shadow:3px 4px 0 var(--red);display:grid;place-items:center;transition:transform .15s ease,box-shadow .15s ease}
  .sg-nav:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 var(--red)}
  .sg-nav:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--red)}
  .sg-nav svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .sg-nav.prev{left:2px}.sg-nav.next{right:2px}

  .sg-cap{position:relative;text-align:center;margin:10px auto 0;max-width:640px;min-height:104px}
  .sg-cap h2{margin:0;font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:clamp(26px,3.4vw,34px);line-height:1.1}
  .sg-cap p{margin:8px 0 0;font-size:clamp(16px,1.8vw,18px);line-height:1.5;color:var(--paper-mut)}
  .sg-cap .swap{animation:sg-swap .5s cubic-bezier(.22,1,.36,1)}
  @keyframes sg-swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .sg-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:14px}
  .sg-dots button{width:10px;height:10px;padding:0;border-radius:99px;border:0;background:rgba(251,247,238,.35);transition:width .35s ease,background-color .35s ease}

  .sg-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px;text-align:center}
  .sg-cta small{color:var(--paper-mut);font-weight:700;font-size:14px}


  @media (max-width:759px){
    .sg{padding-block:24px 32px}
    .sg-nav{width:46px;height:46px;top:auto;bottom:4px;margin-top:0}
    .sg-nav.prev{left:6px}.sg-nav.next{right:6px}
    .sg-cap{min-height:128px}
  }
  @media (prefers-reduced-motion:reduce){
    .sg-card,.sg-art svg,.sg-glow,.sg-dots button{transition-duration:.01s!important}
    .sg-st.pop,.sg-cap .swap{animation:none!important}
  }

  .sg-btn{appearance:none;cursor:pointer;border:3px solid var(--paper);background:var(--red);color:#fff;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;font-size:clamp(1.12rem,2.3vw,1.3rem);padding:18px 30px;border-radius:16px;box-shadow:5px 5px 0 var(--paper);transition:transform .12s ease,box-shadow .12s ease}
  .sg-btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--paper)}
  .sg-btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--paper)}
  body:has(#app .ok) .sg{display:none}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="js/live.js" defer></script>
<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const KIT = 99.97, FRETE = 15.99, PROMO_PRICE = 39.97; /* promoção de lançamento: preço total (kit + envio) das primeiras lojas; limite e valor reais ficam no banco (fid_promo_state) */
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

/* Representante: o código vem no link (?r=) e fica guardado no aparelho por 60 dias. Fica invisível para o cliente. */
const KEY = 'carimbo_r', TTL = 60 * 864e5;
function getCode(){
  const q = new URLSearchParams(location.search).get('r');
  const clean = v => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
  try {
    if(q && clean(q)){ localStorage.setItem(KEY, JSON.stringify({c:clean(q), t:Date.now()})); return clean(q); }
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s && s.c && Date.now() - s.t < TTL) return s.c;
  } catch(e){}
  return clean(q);
}

const MSG = {

const maskDoc = v => { const d = v.replace(/\D/g, '').slice(0, 14); if(d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); return d.replace(/(\d{2})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2'); };
function validDoc(v){ const n = v.replace(/\D/g, ''); if(/^(\d)\1+$/.test(n)) return false;
  if(n.length === 11){ for(const t of [9, 10]){ let s = 0; for(let i = 0; i < t; i++) s += +n[i] * (t + 1 - i); if(((s * 10) % 11) % 10 !== +n[t]) return false; } return true; }
  if(n.length === 14){ for(const t of [12, 13]){ const w = t === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s = 0; for(let i = 0; i < t; i++) s += +n[i] * w[i]; const dv = s % 11 < 2 ? 0 : 11 - (s % 11); if(dv !== +n[t]) return false; } return true; }
  return false; }
const kitNet = () => Math.round(KIT * (100 - (S.coupon ? S.coupon.pct : 0))) / 100;
const total = () => isPromo() ? PROMO_PRICE : kitNet() + FRETE;

/* máscaras */
const maskPhone = v => { const d = v.replace(/\D/g, '').slice(0, 11); if(d.length <= 2) return d ? '(' + d : ''; if(d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`; if(d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; };
const maskCep = v => { const d = v.replace(/\D/g, '').slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; };

  const p = isPromo();
  const sgb = document.getElementById("sg-cta"); if(sgb) sgb.textContent = "Quero o kit por " + brl(p ? PROMO_PRICE : kitNet());

    ? `<div class="price"><b>${brl(PROMO_PRICE)}</b><s>R$ 249</s></div><small style="color:var(--mut)">pagamento único · já com o envio · condição de lançamento${S.promo.left <= 10 ? ` · restam <b>${S.promo.left}</b> de ${S.promo.limit}` : ''}</small>`

async function loadPromo(){
  try { const {data} = await sb.rpc('fid_promo_state'); if(data && typeof data.left === 'number'){ S.promo = data; refresh(); } } catch(_){}
}
function promoMismatch(d){
  if(d && !d.dup && d.promo !== undefined && !!d.promo !== isPromo()){
    S.promo = {left:d.promo ? 1 : 0, limit:10}; S.orderId = d.order; refresh();
    throw new Error('O valor mudou: ' + (d.promo ? 'você conseguiu uma vaga da promoção' : 'as vagas da promoção acabaram') + '. O total agora é ' + brl(d.total) + '. Confira e clique de novo para continuar.');
  }
}
function setErr(id, msg){
  const el = $('#' + id), fe = $('#e-' + id); if(!el) return;
  el.setAttribute('aria-invalid', msg ? 'true' : 'false'); if(fe) fe.textContent = msg || '';
}

/* CEP: ViaCEP, com BrasilAPI como reserva */
let cepSeq = 0;
async function fetchJson(url, ms){
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); }
}
async function lookupCep(cep){
  try {
    const d = await fetchJson(`https://viacep.com.br/ws/${cep}/json/`, 6000);
    if(d && !d.erro) return {street:d.logradouro, district:d.bairro, city:d.localidade, uf:d.uf};
    if(d && d.erro) return null;
  } catch(e){}
  try {
    const d = await fetchJson(`https://brasilapi.com.br/api/cep/v1/${cep}`, 6000);
    if(d && d.city) return {street:d.street, district:d.neighborhood, city:d.city, uf:d.state};
  } catch(e){ return undefined; }
  return null;
}
async function onCep(){
  const raw = $('#cep').value.replace(/\D/g, ''), st = $('#cepst'); setErr('cep', '');
  S.cepOk = false;
  if(raw.length < 8){ st.textContent = ''; st.className = 'cepst'; return; }
  const my = ++cepSeq; st.className = 'cepst'; st.innerHTML = '<span class="spin"></span>Buscando endereço…';
  const r = await lookupCep(raw); if(my !== cepSeq) return;
  if(r){
    S.cepOk = true; st.className = 'cepst ok'; st.textContent = '✓ Endereço encontrado. Confira e informe o número.';
    { const en = $('#etan'); if(en && r.city) en.textContent = 'Para ' + r.city + (r.uf ? '/' + r.uf : '') + ': média de 7 dias pelos Correios, podendo variar um pouco.'; }
    for(const [id, v] of [['rua', r.street], ['bai', r.district], ['cid', r.city], ['uf', r.uf]]){ if(v){ $('#' + id).value = v; setErr(id, ''); } }
    ($('#rua').value ? $('#num') : $('#rua')).focus();
  } else if(r === null){
    st.className = 'cepst warn'; st.textContent = 'CEP não encontrado. Confira o número ou preencha o endereço abaixo.';
  } else {
    st.className = 'cepst warn'; st.textContent = 'Não deu para buscar o CEP agora. Preencha o endereço abaixo.';
  }
}
async function applyCoupon(code, quiet){
  const m = $('#cpm'), c = String(code || '').trim().toLowerCase();
  if(!c){ S.coupon = null; m.textContent = ''; refresh(); return; }
  const {data, error} = await sb.rpc('fid_coupon_check', {p_code:c});
  const pct = !error && data ? +data.percent || 0 : 0;
  if(pct > 0){ S.coupon = {code:c, pct}; m.style.color = '#0E7A47'; m.textContent = 'Cupom aplicado: ' + pct + '% de desconto no kit ✓'; }
  else { S.coupon = null; m.style.color = '#C0392B'; m.textContent = quiet ? '' : MSG.cupom_invalido; }
  refresh();
}
function bind(){
  $('#cpt').onclick = () => { const o = $('#cpbox').hidden; $('#cpbox').hidden = !o; $('#cpt').setAttribute('aria-expanded', String(o)); if(o) $('#cp').focus(); };
  $('#cpb').onclick = () => applyCoupon($('#cp').value);
  $('#cp').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); applyCoupon($('#cp').value); } });
  const pre = new URLSearchParams(location.search).get('cupom'); if(pre){ $('#cpbox').hidden = false; $('#cpt').setAttribute('aria-expanded', 'true'); $('#cp').value = pre; applyCoupon(pre, true); }
  $('#wa').oninput = e => { e.target.value = maskPhone(e.target.value); setErr('wa', ''); };
  $('#doc').oninput = e => { e.target.value = maskDoc(e.target.value); setErr('doc', ''); };
  $('#cep').oninput = e => { e.target.value = maskCep(e.target.value); onCep(); };
  ['nm', 'lj', 'em', 'rua', 'num', 'cid', 'uf', 'pw'].forEach(id => $('#' + id).addEventListener('input', () => setErr(id, '')));
  $('#tg').onclick = () => { const p = $('#pw'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#tg').textContent = show ? 'Ocultar' : 'Mostrar'; };
  $('#f').addEventListener('input', () => { $('#err').textContent = ''; });
  $('#f').addEventListener('change', () => { $('#err').textContent = ''; });
  /* carrinho abandonado: salva contato (nome + WhatsApp válidos) quando a pessoa sai do campo; some do funil se ela comprar */
  let leadSig = '';
  const saveLead = () => {
    if(UPG) return;
    const n = $('#nm').value.trim(), w = $('#wa').value.replace(/\D/g, ''), e = $('#em').value.trim(), s = $('#lj').value.trim();
    if(n.length < 2 || (w.length !== 10 && w.length !== 11)) return;
    const em = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e) ? e : '', sig = [n, w, em, s].join('|');
    if(sig === leadSig) return; leadSig = sig;
    try { Promise.resolve(sb.rpc('fid_capture_lead', {p_name:n, p_whatsapp:w, p_email:em || null, p_store:s || null})).catch(() => {}); } catch(_){}
  };
  ['nm', 'lj', 'wa', 'em'].forEach(id => $('#' + id).addEventListener('blur', saveLead));
  $('#f').onsubmit = submit;
}

function validate(){
  const v = id => $('#' + id).value.trim(), bad = [];
  const chk = (id, ok, msg) => { setErr(id, ok ? '' : msg); if(!ok) bad.push(id); };
  chk('nm', v('nm').length >= 2, 'Informe o seu nome.');
  if(!UPG) chk('lj', v('lj').length >= 2, 'Informe o nome da loja.');
  chk('wa', v('wa').replace(/\D/g, '').length >= 10, 'Informe o WhatsApp com DDD.');
  if(!UPG) chk('em', /^\S+@\S+\.\S+$/.test(v('em')), 'Confira o e-mail.');
  chk('doc', validDoc(v('doc')), 'CPF ou CNPJ inválido. Confira os números.');
  if(S.delivery === 'correios'){
    chk('cep', v('cep').replace(/\D/g, '').length === 8, 'Informe o CEP com 8 números.');
    chk('rua', v('rua').length >= 3, 'Informe a rua.');
    chk('num', v('num').length >= 1, 'Informe o número (ou S/N).');
    chk('cid', v('cid').length >= 2, 'Informe a cidade.');
    chk('uf', !!$('#uf').value, 'Escolha o estado.');
  }
  if(!UPG) chk('pw', $('#pw').value.length >= 6, 'A senha precisa ter pelo menos 6 caracteres.');
  return bad;
}

async function submit(ev){
  ev.preventDefault();
  const err = m => { $('#err').textContent = m; }; err('');
  const bad = validate();
  if(bad.length){ const el = $('#' + bad[0]); el.scrollIntoView({behavior:'smooth', block:'center'}); el.focus({preventScroll:true}); return err('Falta preencher ' + (bad.length === 1 ? 'um campo' : bad.length + ' campos') + ' acima.'); }
  const v = id => $('#' + id).value.trim(), em = v('em'), pw = $('#pw').value, c = S.delivery === 'correios';
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Enviando…';
  try { gtag('event', 'begin_checkout', {currency:'BRL'}); } catch(_){}
  try { fbq('track', 'InitiateCheckout', {value:total(), currency:'BRL'}); localStorage.setItem('carimbo_pv', String(total())); } catch(_){}
  try {
    let {data:{session}} = await sb.auth.getSession();
    if(UPG && !session){ location.href = 'lojista'; return; }
    if(!UPG && session && session.user.email !== em.toLowerCase()){ await sb.auth.signOut(); session = null; }
    if(!UPG && !session){
      const up = await sb.auth.signUp({email:em, password:pw});
      session = up.data && up.data.session;
      if(!session){
        const si = await sb.auth.signInWithPassword({email:em, password:pw});
        if(si.error) throw new Error(up.error ? up.error.message : 'Este e-mail já tem cadastro e a senha não confere. Use a senha da sua conta ou outro e-mail.');
      }
    }
    if(!S.orderId && UPG){
      const {data, error} = await sb.rpc('fid_trial_kit_order', {p_buyer_name:v('nm'), p_whatsapp:v('wa'), p_delivery:S.delivery,
        p_cep:c ? v('cep') : null, p_street:c ? v('rua') : null, p_number:c ? v('num') : null, p_complement:c ? v('comp') : null, p_district:c ? v('bai') : null, p_city:c ? v('cid') : null, p_state:c ? $('#uf').value : null, p_coupon:S.coupon ? S.coupon.code : null});
      if(error) throw new Error(error.message);
      if(data && data.error) throw new Error(MSG[data.error] || data.error);
      S.orderId = data.order; promoMismatch(data);
    }
    if(!S.orderId){
    const {data, error} = await sb.rpc('fid_order_create', {p_code:CODE, p_store_name:v('lj'), p_buyer_name:v('nm'), p_whatsapp:v('wa'), p_delivery:S.delivery,
      p_cep:c ? v('cep') : null, p_street:c ? v('rua') : null, p_number:c ? v('num') : null, p_complement:c ? v('comp') : null, p_district:c ? v('bai') : null, p_city:c ? v('cid') : null, p_state:c ? $('#uf').value : null, p_coupon:S.coupon ? S.coupon.code : null});
    if(error) throw new Error(error.message);
    if(data && data.error) throw new Error(MSG[data.error] || data.error);
    S.orderId = data.order; promoMismatch(data);
    }
    btn.textContent = 'Abrindo o pagamento…';
    const r = await sb.functions.invoke('asaas-checkout', {body:{order_id:S.orderId, cpf_cnpj:v('doc')}});
    const url = r.data && r.data.url;
    if(url){ try{ window.liveStep && window.liveStep('pagamento'); }catch(_){} window.location.href = url; return; }
    let code = r.data && r.data.error;
    if(!code && r.error && r.error.context && r.error.context.json){ try { code = (await r.error.context.json()).error; } catch(_){} }
    if(code === 'cpf_cnpj_invalido'){ setErr('doc', 'CPF ou CNPJ inválido. Confira os números.'); throw new Error('Confira o CPF ou CNPJ.'); }
    if(code === 'pedido_ja_pago'){ window.location.href = 'lojista'; return; }
    done(UPG ? 'sua loja' : v('lj'), v('nm'));
  } catch(e){
    err(e.message || 'Não foi possível enviar o pedido. Tente de novo.');
    btn.disabled = false; refresh();
  }
}

function done(store, name){
  const wa = (window.FID && FID.SALES_WHATSAPP || '').replace(/\D/g, ''), c = S.delivery === 'correios';
  const txt = encodeURIComponent('Oi! Acabei de fazer o pedido do kit Carimbô para a loja ' + store + '.');
  app.innerHTML = `<div class="ok card"><div class="seal">✓</div><h1>Pedido recebido!</h1>
