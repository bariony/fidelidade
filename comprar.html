<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carimbô · Peça o seu kit</title>
<meta name="description" content="Kit de boas-vindas Carimbô: 2 bastões de carimbo por toque, placa NFC de avaliação do Google e 30 dias de painel.">
<meta property="og:title" content="Carimbô: peça o seu kit">
<meta property="og:description" content="Cartão fidelidade por toque NFC. Sem app. Kit com 2 bastões, placa NFC de avaliação do Google e 30 dias de painel.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://carimbo.io/img/bastao-hero.webp">
<meta name="theme-color" content="#14296B">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#14296B;--red:#E03A2F;--kraft:#EAD9B6;--paper:#FBF7EE;--mut:#4a5a8c;--line:#E4D9C0;--bad:#C0392B;--good:#0E7A47}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
  h1,h2,h3,.btn,.brand{font-family:'Fredoka',system-ui,sans-serif}
  h1,h2,h3{margin:0;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  button,input,textarea{font:inherit;color:inherit}
  .top{background:var(--navy);padding:14px 0;border-bottom:4px solid var(--red)}
  .wrap{width:min(980px,100% - 32px);margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:1.25rem;text-decoration:none}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--paper);display:grid;place-items:center;box-shadow:3px 3px 0 var(--red)}
  .logo svg{width:24px;height:24px}
  .brand em{font-style:normal;color:#FF7B6E}
  main{padding:30px 0 70px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
  h1{font-size:clamp(1.9rem,4.4vw,2.7rem)}
  .lead{color:var(--mut);margin:10px 0 0;font-size:1.08rem}
  .card{background:#fff;border:3px solid var(--navy);border-radius:22px;padding:24px;box-shadow:5px 5px 0 var(--navy)}
  label{display:block;font-size:.88rem;color:var(--mut);margin:15px 0 6px;font-weight:700}
  input,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:48px}
  textarea{resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:3px 3px 0 var(--red)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .sec{margin:26px 0 0;padding-top:20px;border-top:2px dashed var(--line)}
  .sec h3{font-size:1.1rem}
  .sec small{display:block;color:var(--mut);margin-top:4px}
  .btn{appearance:none;width:100%;margin-top:22px;border:3px solid var(--navy);background:var(--red);color:#fff;font-weight:600;font-size:1.2rem;padding:16px 24px;border-radius:16px;box-shadow:4px 4px 0 var(--navy);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.line{background:#fff;color:var(--navy)}
  .err{color:var(--bad);font-weight:700;min-height:1.3em;margin:12px 0 0}
  .sum h2{font-size:1.35rem}
  .price{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
  .price b{font-family:'Fredoka',sans-serif;font-size:2.6rem;line-height:1}
  .price s{color:var(--mut)}
  ul.in{list-style:none;padding:0;margin:14px 0 0}
  ul.in li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  ul.in li:first-child{border-top:0}
  ul.in i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800;margin-top:2px}
  .after{margin-top:16px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.93rem;color:var(--mut)}
  .after b{color:var(--navy)}
  .ok{max-width:560px;margin:0 auto;text-align:center}
  .ok .seal{width:84px;height:84px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:2.6rem;margin:0 auto 18px;border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy)}
  .ok ol{text-align:left;margin:20px 0 0;padding-left:22px}
  .ok li{margin:8px 0}
  .fine{font-size:.82rem;color:var(--mut);margin-top:14px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.sum{order:-1}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="./"><span class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="22" r="13" fill="#14296B"/><rect x="44" y="30" width="12" height="26" fill="#14296B"/><rect x="22" y="54" width="56" height="16" rx="6" fill="#14296B"/><rect x="14" y="78" width="72" height="9" rx="4.5" fill="#E03A2F"/></svg></span><span>carimb<em>ô</em></span></a></div></header>
<main><div class="wrap" id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Representante: o código vem no link (?r=) e fica guardado no aparelho por 60 dias. Fica invisível para o cliente. */
const KEY = 'carimbo_r', TTL = 60 * 864e5;
function getCode(){
  const q = new URLSearchParams(location.search).get('r');
  const clean = v => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
  try {
    if(q && clean(q)){ localStorage.setItem(KEY, JSON.stringify({c:clean(q), t:Date.now()})); return clean(q); }
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s && s.c && Date.now() - s.t < TTL) return s.c;
  } catch(e){}
  return clean(q);
}
const CODE = getCode();

const MSG = {
  nome_da_loja_invalido:'Confira o nome da loja.', nome_invalido:'Confira o seu nome.', whatsapp_invalido:'Confira o WhatsApp, com DDD.',
  endereco_invalido:'Informe o endereço completo de entrega (rua, número, bairro, cidade e CEP).', entre_primeiro:'Entre com e-mail e senha para continuar.'
};

function view(){
  app.innerHTML = `<div class="grid">
    <section><h1>Peça o seu kit Carimbô</h1>
      <p class="lead">Preencha os dados abaixo. Você já cria o acesso ao seu painel e a gente prepara o envio.</p>
      <form id="f" class="card" style="margin-top:22px" novalidate>
        <h3>Sobre você e a loja</h3>
        <div class="two"><div><label for="nm">Seu nome</label><input id="nm" autocomplete="name" required></div>
          <div><label for="lj">Nome da loja</label><input id="lj" autocomplete="organization" required></div></div>
        <div class="two"><div><label for="wa">WhatsApp (com DDD)</label><input id="wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" required></div>
          <div><label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required></div></div>
        <div class="sec"><h3>Entrega</h3><small>Enviamos pelos Correios.</small>
          <label for="ad">Endereço completo</label><textarea id="ad" rows="3" autocomplete="street-address" placeholder="Rua, número, complemento, bairro, cidade, estado e CEP" required></textarea></div>
        <div class="sec"><h3>Acesso ao painel</h3><small>Com este e-mail e esta senha você entra no painel da sua loja.</small>
          <label for="pw">Crie uma senha (mínimo 6 caracteres)</label><input id="pw" type="password" minlength="6" autocomplete="new-password" required></div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" id="go">Fazer o pedido</button>
        <p class="fine">Ao fazer o pedido você concorda em receber o contato da equipe Carimbô por WhatsApp para combinar o pagamento.</p>
      </form></section>
    <aside class="card sum"><h2>Kit de boas-vindas</h2>
      <div class="price"><b>R$ 149</b><s>R$ 249</s></div>
      <small style="color:var(--mut)">pagamento único · preço de lançamento</small>
      <ul class="in">
        <li><i>✓</i><span><b>2 bastões Carimbô</b> para o balcão</span></li>
        <li><i>✓</i><span><b>Placa NFC de avaliação do Google</b></span></li>
        <li><i>✓</i><span><b>30 dias de painel</b> já incluídos</span></li>
        <li><i>✓</i><span><b>Configuração</b> da sua loja</span></li>
      </ul>
      <div class="after"><b>Depois do 1º mês:</b> R$ 49,97 por mês para manter o painel.</div></aside></div>`;
  $('#f').onsubmit = submit;
}

async function submit(ev){
  ev.preventDefault();
  const v = id => $('#' + id).value.trim(), err = m => { $('#err').textContent = m; };
  err('');
  const nm = v('nm'), lj = v('lj'), wa = v('wa'), em = v('em'), ad = v('ad'), pw = $('#pw').value;
  if(nm.length < 2 || lj.length < 2) return err('Preencha o seu nome e o nome da loja.');
  if(wa.replace(/\D/g, '').length < 10) return err('Confira o WhatsApp, com DDD.');
  if(!/^\S+@\S+\.\S+$/.test(em)) return err('Confira o e-mail.');
  if(ad.length < 10) return err(MSG.endereco_invalido);
  if(pw.length < 6) return err('A senha precisa ter pelo menos 6 caracteres.');
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    let {data:{session}} = await sb.auth.getSession();
    if(session && session.user.email !== em.toLowerCase()){ await sb.auth.signOut(); session = null; }
    if(!session){
      const up = await sb.auth.signUp({email:em, password:pw});
      session = up.data && up.data.session;
      if(!session){
        const si = await sb.auth.signInWithPassword({email:em, password:pw});
        if(si.error) throw new Error(up.error ? up.error.message : 'Este e-mail já tem cadastro e a senha não confere. Use a senha da sua conta ou outro e-mail.');
      }
    }
    const {data, error} = await sb.rpc('fid_order_create', {p_code:CODE, p_store_name:lj, p_buyer_name:nm, p_whatsapp:wa, p_ship_address:ad});
    if(error) throw new Error(error.message);
    if(data && data.error) throw new Error(MSG[data.error] || data.error);
    done(lj, nm);
  } catch(e){
    err(e.message || 'Não foi possível enviar o pedido. Tente de novo.');
    btn.disabled = false; btn.textContent = 'Fazer o pedido';
  }
}

function done(store, name){
  const wa = (window.FID && FID.SALES_WHATSAPP || '').replace(/\D/g, '');
  const txt = encodeURIComponent('Oi! Acabei de fazer o pedido do kit Carimbô para a loja ' + store + '.');
  app.innerHTML = `<div class="ok card"><div class="seal">✓</div><h1>Pedido recebido!</h1>
    <p class="lead">Obrigado, ${esc(name.split(' ')[0])}. Já criamos o acesso ao painel da loja <b>${esc(store)}</b>.</p>
    <ol><li><b>Pagamento:</b> a equipe Carimbô chama você no WhatsApp para combinar o pagamento.</li>
      <li><b>Envio:</b> com o pagamento confirmado, o kit vai pelos Correios.</li>
      <li><b>Enquanto isso:</b> entre no painel e deixe a sua loja pronta.</li></ol>
    ${wa ? `<a class="btn" href="https://wa.me/${wa}?text=${txt}" target="_blank" rel="noopener">Falar no WhatsApp</a>` : ''}
    <a class="btn ${wa ? 'line' : ''}" href="lojista.html">Entrar no painel da loja</a></div>`;
  window.scrollTo(0, 0);
}
view();
</script>
</body>
</html>
