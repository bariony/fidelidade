<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14296B">
<title>Carimbô · painel da loja</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14296B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF7EE;--ink:#14296B;--primary:#14296B;--primary-d:#0E1D4E;--deep:#14296B;--lilac:#F3EAD6;--track:#F1EADB;--line:#E4D9C0;--muted:#3D4C80;--alert:#C0392B;--good:#0E7A47;--red:#E03A2F;--kraft:#EAD9B6;--hard:4px 4px 0 #14296B;color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
  h1,h2,h3,.btn,.brand,.strip b,.band h2,.row .n,.seg button,.chip,.navbtn{font-family:'Fredoka','Nunito',system-ui,sans-serif}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.15}
  h1{font-size:clamp(1.55rem,3vw,2.1rem)}
  h2{font-size:1.15rem}
  h3{font-size:1rem}
  p{margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--primary-d);outline-offset:2px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:2.5px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;font-weight:600;font-size:1.02rem;cursor:pointer;min-height:44px;text-decoration:none;box-shadow:var(--hard);transition:transform .08s,box-shadow .08s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn.line{background:#fff;color:var(--ink)}
  .btn.line:hover{background:var(--lilac)}
  .btn.small{padding:6px 13px;min-height:36px;font-size:.92rem;box-shadow:3px 3px 0 var(--ink)}
  .btn:disabled{opacity:.55;cursor:default}

  label{display:block;font-size:.88rem;font-weight:700;color:var(--ink);margin:14px 0 5px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;min-height:44px}
  textarea{min-height:120px;resize:vertical;line-height:1.5}
  input[type=color]{width:100%;height:44px;padding:4px;border:2.5px solid var(--ink);border-radius:12px;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:3px 3px 0 var(--red);outline:none}
  .check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:1rem;margin:4px 0}
  .check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--red)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .err{color:var(--alert);margin-top:12px;min-height:1.2em}
  .note{color:var(--muted)}
  .pbanner{border:2.5px solid var(--ink);border-radius:14px;padding:11px 16px;margin-bottom:18px;font-weight:600}
  .pbanner.info{background:var(--lilac);color:var(--deep)}
  .pbanner.warn{background:#FEF0D0;color:#92400E}
  .pbanner.bad{background:#FDE1DE;color:#A52A1E}
  .bdg{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;min-width:20px;padding:1px 6px;font-size:.75rem;font-weight:700;text-align:center}
  .collapsed .bdg{position:absolute;top:4px;right:6px;margin:0;min-width:16px;font-size:.65rem;padding:0 4px}
  .pend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px}
  .pend .code{font-size:1.4rem;font-weight:800;letter-spacing:.2em;color:var(--primary-d)}
  .sub{display:block;color:var(--muted);font-size:.85rem}
  .nw{white-space:nowrap}

  /* ---------- estrutura e menu ---------- */
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
  .shell.collapsed{grid-template-columns:76px minmax(0,1fr)}
  .rail{background:#fff;border-right:3px solid var(--ink);padding:12px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.6rem;letter-spacing:-.01em;padding:2px 8px 12px;color:var(--ink)}
  .brand svg{flex:none}
  .brand em{font-style:normal;color:var(--red)}
  .nav{display:flex;flex-direction:column;gap:2px}
  a.navbtn{text-decoration:none;box-sizing:border-box}
  .navbtn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:500;cursor:pointer;text-align:left}
  .navbtn svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .navbtn:hover{background:var(--lilac);color:var(--primary-d)}
  .navbtn[aria-current=page]{background:var(--primary);color:#fff;font-weight:600;box-shadow:3px 3px 0 var(--red)}
  .rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
  .rail .email{padding:6px 12px 0;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
  .collapsed .lb,.collapsed .brand span,.collapsed .email{display:none}
  .collapsed .navbtn{justify-content:center;padding:8px 0}
  .collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
  .collapsed #col svg{transform:rotate(180deg)}
  .collapsed .navbtn:hover::after,.collapsed .navbtn:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;padding:6px 11px;border-radius:8px;font-size:.85rem;font-weight:500;white-space:nowrap;z-index:60;pointer-events:none}

  main{padding:28px clamp(18px,3vw,44px) 56px;width:100%;min-width:0}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .head p{margin-top:5px;color:var(--muted)}
  .back{margin-bottom:14px}

  /* ---------- hoje ---------- */
  .band{background:var(--deep);color:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--red);border-radius:24px;padding:28px clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:26px;align-items:center}
  .band h2{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800;letter-spacing:-.025em;}
  .band p{margin-top:8px;color:#EAD9B6;max-width:52ch}
  .marks{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
  .mark{--r:0deg;width:40px;height:40px;border-radius:50%;border:2.5px solid #EAD9B6;display:grid;place-items:center;color:#EAD9B6;flex:none;transform:rotate(var(--r))}
  .mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .mark.more{border-style:dashed;font-weight:700;font-size:.9rem;width:auto;padding:0 13px;border-radius:20px}
  .play .mark{animation:stamp .38s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i) * 38ms)}
  @keyframes stamp{from{opacity:0;transform:scale(.35) rotate(var(--r))}}
  @media (prefers-reduced-motion:reduce){.play .mark{animation:none}.shell{transition:none}}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:26px;border-top:3px solid var(--ink)}
  .strip>div{padding:14px 16px 4px 0}
  .strip>div+div{padding-left:18px;border-left:1px solid var(--line)}
  .strip b{display:block;font-size:clamp(1.7rem,3vw,2.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .strip span{color:var(--muted);font-size:.9rem}
  .strip em{font-style:normal;font-size:.82rem;font-weight:700;margin-left:8px}
  .up{color:var(--good)} .down{color:var(--alert)}

  .dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:24px;align-items:start;margin-top:30px}
  .panel{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px 20px;box-shadow:var(--hard)}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .tools{display:flex;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--track);border:2.5px solid var(--ink);border-radius:12px;padding:2px}
  .seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
  .seg button[aria-pressed=true]{background:var(--ink);color:#fff}
  #csum{color:var(--muted);margin-bottom:4px}
  #csum b{color:var(--ink);font-size:1.5rem;margin-right:4px}
  #chart{position:relative;width:100%}
  #chart svg{display:block;max-width:100%}
  .tip{position:absolute;background:var(--ink);color:#fff;padding:6px 11px;border-radius:8px;font-size:.85rem;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}

  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:12px 0 4px}
  .bar i{display:block;height:100%}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t b{display:flex;align-items:center;font-weight:600}
  .row .t small{display:block;color:var(--muted);font-size:.86rem;margin-left:18px}
  .row .n{font-size:1.3rem;font-weight:700}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
  .side h2+.bar{margin-top:14px}

  /* ---------- listas, filtros, tabelas ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
  .chip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px}
  .chip small{color:var(--muted);margin-left:4px;font-weight:500}
  .chip:hover{background:var(--lilac)}
  .chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
  .chip[aria-pressed=true] small{color:#EAD9B6}
  table{width:100%;border-collapse:collapse}
  th{font-size:.82rem;color:var(--muted);font-weight:700;text-align:left;padding:10px 8px;border-bottom:2.5px solid var(--ink)}
  td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr[data-c]{cursor:pointer}
  tr[data-c]:hover{background:#FFFDF7}
  td a{color:var(--primary-d)}
  .list .item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .list .item .t{min-width:0;flex:1 1 240px}
  .list .item .t b{display:block}
  code{background:var(--lilac);color:var(--deep);padding:2px 7px;border-radius:6px;font-size:.82rem;overflow-wrap:anywhere}
  .done{opacity:.55}
  .sec{margin-top:34px}
  .sec>header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  .split.s13{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
  .rform{max-width:880px}
  .rbox{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--hard)}
  .rsec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;padding:24px 28px}
  .rsec+.rsec{border-top:1px solid var(--line)}
  .rt h2{margin:0 0 4px;font-size:1.05rem}
  .rt p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45}
  .rf label:first-child{margin-top:0}
  .rf .btn{width:100%}
  .rf input[type=color]{width:96px}
  .pv{border-radius:18px;padding:16px 16px 18px;max-width:300px}
  .pv b{display:block;font-size:1.05rem}
  .pv small{opacity:.85}
  .pvg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
  .pvg i{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1rem}
  .picker{margin-bottom:6px}
  .pg{font-size:.78rem;color:var(--muted);margin:12px 0 6px}
  .pgrid{display:flex;flex-wrap:wrap;gap:6px}
  .pk{width:42px;height:42px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:1.25rem;cursor:pointer;color:var(--ink)}
  .pk:hover{background:var(--lilac)}
  .pk[aria-pressed=true]{background:var(--kraft);box-shadow:3px 3px 0 var(--red)}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;margin:0!important;color:var(--ink)!important;font-size:.88rem}
  .sw.top{font-size:1rem;font-weight:600;margin-bottom:6px!important}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw i{position:relative;flex:none;width:42px;height:24px;border-radius:99px;border:2px solid var(--ink);background:#EAD9B6;transition:background .15s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked+i{background:var(--red)}
  .sw input:checked+i::after{transform:translateX(18px)}
  .sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
  .lrow{margin-top:12px;padding:14px;border:2.5px solid var(--ink);border-radius:16px;background:#fff}
  .lrow:first-child{margin-top:0}
  .ltop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ltop b{font-size:1rem}
  .swl{color:var(--muted);font-size:.85rem}
  .lrow.off input[type=text]{opacity:.5}
  .lrow.off .bonus{display:none}
  .bonus{display:block;margin:10px 0 0!important;cursor:pointer}
  .bonus input{position:absolute;opacity:0;width:0;height:0}
  .bonus span{display:block;padding:9px 12px;border:2px dashed #8A93B5;border-radius:10px;font-size:.88rem;color:var(--muted)}
  .bonus input:checked+span{border:2px solid var(--ink);background:var(--kraft);color:var(--primary-d);font-weight:600}
  .bonus input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
  .nor{display:block;margin-top:10px;font-size:.82rem;color:var(--muted)}
  .szl{display:flex;justify-content:space-between;margin-top:18px;max-width:300px}
  input[type=range]{width:100%;max-width:300px;accent-color:var(--primary);padding:0;min-height:0}
  .hint{margin:10px 0 0;color:var(--muted);font-size:.88rem}
  .savebar{position:sticky;bottom:0;padding:14px 0;margin-top:6px;background:linear-gradient(transparent,var(--paper) 40%)}

  .auth{min-height:100vh;display:grid;place-items:center;padding:20px}
  .auth form{width:min(100%,390px)}
  .auth .brand{padding:0 0 22px}
  .auth .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  .fab{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:0;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:99px;box-shadow:var(--hard);font-weight:700}
  .fab button{background:none;border:0;color:#fff;cursor:pointer;min-height:44px;padding:0 16px;font-weight:700}
  .fab .x{padding:0 12px 0 4px;opacity:.85;font-size:1.1rem}

  /* ---------- Tum, assistente da loja ---------- */
  #tum{position:fixed;right:18px;bottom:18px;z-index:70;font-family:inherit}
  #tum .tbtn{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:2.5px solid var(--ink);border-radius:99px;box-shadow:var(--hard);min-height:48px;padding:0 18px 0 14px;font-weight:800;font-size:1rem;cursor:pointer;font-family:'Fredoka',inherit}
  #tum .tbtn:active{transform:translate(2px,2px);box-shadow:none}
  #tum .tbtn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #tum .tpanel{display:none;position:absolute;right:0;bottom:60px;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100vh - 150px));background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--hard);overflow:hidden;flex-direction:column}
  #tum.open .tpanel{display:flex}
  #tum.open .tbtn{display:none}
  #tum .thead{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;padding:10px 12px;border-bottom:3px solid var(--ink)}
  #tum .thead b{font-family:'Fredoka',inherit;font-size:1.15rem;line-height:1}
  #tum .thead small{display:block;opacity:.85;font-size:.76rem}
  #tum .thead .sp{flex:1}
  #tum .thead button{background:none;border:0;color:#fff;cursor:pointer;font-size:1.3rem;min-width:36px;min-height:36px;border-radius:8px}
  #tum .tmsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
  #tum .m{max-width:88%;padding:9px 12px;border-radius:14px;border:2px solid var(--ink);font-size:.95rem;line-height:1.4;word-wrap:break-word}
  #tum .m.u{align-self:flex-end;background:var(--kraft)}
  #tum .m.a{align-self:flex-start;background:#fff}
  #tum .m.a ul{margin:6px 0 2px;padding-left:18px}
  #tum .m .cp{display:inline-block;margin-top:8px;background:none;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink)}
  #tum .m.err{background:#FDECEA}
  #tum .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px;background:var(--paper)}
  #tum .chips button{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--ink)}
  #tum form{display:flex;gap:8px;padding:10px;border-top:3px solid var(--ink);background:#fff}
  #tum textarea{flex:1;resize:none;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:1rem;min-height:42px;max-height:100px}
  #tum form button{border:2.5px solid var(--ink);background:var(--red);color:#fff;border-radius:12px;font-weight:800;padding:0 14px;cursor:pointer}
  #tum form button:disabled{opacity:.55;cursor:default}
  #tum .dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--ink);animation:tumd 1s infinite}
  #tum .dots span:nth-child(2){animation-delay:.15s}#tum .dots span:nth-child(3){animation-delay:.3s}
  @keyframes tumd{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (max-width:520px){#tum{right:12px;bottom:14px}#tum .tpanel{position:fixed;right:8px;left:8px;width:auto;bottom:8px;height:calc(100vh - 16px)}}
  .ovl{position:fixed;inset:0;background:rgba(20,41,107,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:var(--hard);padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .modal h2{margin-bottom:6px}
  .sub2{color:var(--muted);font-size:.92rem}
  .subbox{display:grid;gap:12px}
  .brow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1.5px solid var(--line);flex-wrap:wrap}
  .brow:first-child{border-top:0}
  .brow b{font-family:'Fredoka',sans-serif}
  .thread{display:grid;gap:8px;margin:10px 0}
  .bub{padding:9px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
  .bub.adm{background:var(--lilac);justify-self:end}
  .bub small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:6px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:99;box-shadow:4px 4px 0 var(--ink);border:2.5px solid var(--ink);max-width:90vw;display:none}

  @media (max-width:1180px){

<script>
const sb = supabase.createClient(FID.SUPABASE_URL, FID.SUPABASE_KEY);
const RECOVERY = /type=recovery/.test(location.hash);
const root = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = location.origin + location.pathname.replace(/[^/]*$/, '');
const code = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
const pl = (n, a, b) => n === 1 ? a : b;
const DAY = 86400000, RISK_DAYS = 14;
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mq = window.matchMedia('(max-width:820px)');
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };

const S = { isSuper:false, user:null, store:null, tags:[], customers:[], stats:null, pending:[], view:'hoje', detail:null,
  chart:{kind:'stamps', range:'dias'}, filter:'todos', q:'', camp:{seg:'risco', msg:null}, firstPaint:true,
  collapsed: lsGet('fid_rail') === '1' };

/* ---------- avisos e erros ---------- */
function toast(msg, bad){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.style.background = bad ? '#B42318' : '#12805C'; t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 4200);
}
window.addEventListener('error', e => toast('Erro na página: ' + e.message, true));
window.addEventListener('unhandledrejection', e => toast('Erro: ' + ((e.reason && e.reason.message) || e.reason), true));

/* ---------- ícones ---------- */
const ICON = {
  ig:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/></svg>',
  card:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>',
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  users:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/></svg>',
  mega:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg>',
  tap:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="1.6"/><path d="M6 12a6 6 0 0 1 6 6"/><path d="M6 6.5A11.5 11.5 0 0 1 17.5 18"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
  out:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>',
  gift:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-4-6-4-5 0 .5 1.5 3 1.2 5 0zM12 8c1.5-4 6-4 5 0-.5 1.5-3 1.2-5 0z"/></svg>',
  store:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M10 20v-5h4v5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'
};
const LOGO = '<svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><circle cx="50" cy="22" r="13" fill="#14296B"/><rect x="44" y="30" width="12" height="26" fill="#14296B"/><rect x="22" y="54" width="56" height="16" rx="6" fill="#14296B"/><rect x="14" y="78" width="72" height="9" rx="4.5" fill="#E03A2F"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const NAV = [['hoje','Hoje','home'],['clientes','Clientes','users'],['retiradas','Retiradas','gift'],['campanhas','Campanhas','mega'],['tags','Tags','tap'],['loja','Loja','store'],['regras','Regras','sliders'],['assinatura','Assinatura','card']];

/* ---------- utilidades ---------- */
function head(title, sub, right){
  return `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${right || ''}</div>`;
}
function rel(d){
  if(!d) return 'nunca';
  const dt = new Date(d), now = new Date();
  const a = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((b - a) / DAY);
  const hm = dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  if(days <= 0) return 'hoje, ' + hm;
  if(days === 1) return 'ontem, ' + hm;
  if(days < 30) return 'há ' + days + ' dias';
  return dt.toLocaleDateString('pt-BR');
}
const fmtFull = d => new Date(d).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const waLink = (c, text) => 'https://wa.me/' + (c.whatsapp.length <= 11 ? '55' + c.whatsapp : c.whatsapp) + (text ? '?text=' + encodeURIComponent(text) : '');
const niceMax = n => { if(n <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(n))), m = n / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };

/* ---------- segmentos de clientes ---------- */
function segments(){
  const C = S.customers, n = C.length, goal = S.store.stamps_goal, now = Date.now();
  const ranked = [...C].sort((a, b) => b.total_stamps - a.total_stamps);
  const top = n ? Math.max(1, Math.ceil(n * .1)) : 0, mid = Math.round(n * .6), tier = {};
  ranked.forEach((c, i) => { tier[c.id] = i < top ? 'fieis' : i < top + mid ? 'regulares' : 'ocasionais'; });
  const out = {todos:C, fieis:[], regulares:[], ocasionais:[], risco:[], faltapouco:[], premio:[]};
  C.forEach(c => {
    out[tier[c.id]].push(c);
    const days = c.last_stamp_at ? Math.floor((now - new Date(c.last_stamp_at)) / DAY) : null;
    if(c.total_stamps >= 2 && days !== null && days >= RISK_DAYS) out.risco.push(c);
    if(goal >= 3 && c.stamps > 0 && goal - c.stamps <= 2) out.faltapouco.push(c);
    if(c.rewards_available > 0) out.premio.push(c);
  });
  out._tier = tier;
  return out;
}
const SEGINFO = {
  todos:{n:'Todos', d:''},
  fieis:{n:'Fiéis', d:'os 10% que mais carimbam', c:'#14296B'},
  regulares:{n:'Regulares', d:'os 60% do meio', c:'#6A7DC4'},
  ocasionais:{n:'Ocasionais', d:'os 30% que menos carimbam', c:'#B9A885'},
  risco:{n:'Em risco', d:'já voltaram antes, mas faz ' + RISK_DAYS + ' dias ou mais que não aparecem', c:'#E03A2F'},
  faltapouco:{n:'Quase lá', d:'faltam 2 carimbos ou menos para o prêmio', c:'#E0A100'},
  premio:{n:'Com prêmio', d:'têm prêmio esperando para resgatar', c:'#0E7A47'}
};

/* ---------- dados ---------- */
async function load(){
  const {data:stores, error:e0} = await sb.from('fid_stores').select('*').order('created_at');
  if(e0){ toast('Não foi possível carregar: ' + e0.message, true); return; }
  if(!stores || !stores.length){ S.store = null; render(); return; }
  S.store = stores[0]; loadBill(true);
  const [t, c, st, pe, rc] = await Promise.all([
    sb.from('fid_tags').select('*').eq('store_id', S.store.id).order('created_at'),
    sb.from('fid_customers').select('*').eq('store_id', S.store.id).order('last_stamp_at', {ascending:false, nullsFirst:false}).range(0, 4999),
    sb.rpc('fid_stats', {p_store: S.store.id}),
    sb.rpc('fid_admin_pending', {p_store: S.store.id}),
    sb.from('fid_events').select('id,customer_id,kind,created_at,tag_id').eq('store_id', S.store.id).in('kind', ['stamp', 'bonus']).order('created_at', {ascending:false}).limit(8)
  ]);
  S.recent = (rc.data) || [];
  S.pending = (pe.data && pe.data.items) || [];
  if(S.superFor !== (S.user && S.user.id)){ S.superFor = S.user && S.user.id; S.isSuper = false; const r = await sb.rpc('fid_is_super'); S.isSuper = r.data === true; }
  S.tags = t.data || []; S.customers = c.data || [];
  S.stats = (st.data && !st.data.error) ? st.data : null;
  render();
}
async function openCustomer(cid, stay){

/* endereço por tela: lojista.html#/clientes, #/assinatura, #/clientes/ID ... */
const VIEWS = ['hoje','clientes','retiradas','campanhas','tags','loja','regras','assinatura'];
const hashFor = () => S.view === 'cliente' && S.detail && S.detail.c ? '#/clientes/' + S.detail.c.id : '#/' + S.view;
function syncHash(){ const h = hashFor(); if(location.hash === h) return; try { if(!location.hash) history.replaceState(null, '', h); else history.pushState(null, '', h); } catch(e){} }
function parseHash(){
  const m = location.hash.match(/^#\/([a-z]+)(?:\/([\w-]+))?/); if(!m) return null;
  if(m[1] === 'clientes' && m[2]) return {view:'cliente', id:m[2]};
  return VIEWS.includes(m[1]) ? {view:m[1]} : null;
}
async function applyRoute(){
  const r = parseHash(); if(!r || !S.user || !S.store) return;
  if(r.id){ await openCustomer(r.id, true); return; }
  S.view = r.view; render(); window.scrollTo(0, 0); if(r.view === 'assinatura') loadBill();
}
window.addEventListener('popstate', applyRoute);
function go(view){ S.view = view; render(); window.scrollTo(0, 0); if(view === 'assinatura') loadBill(); syncHash(); }

function planBanner(){
  const s = S.store; if(!s || !s.renews_at) return '';
  const d = Math.round((new Date(s.renews_at + 'T12:00:00') - new Date(new Date().toISOString().slice(0, 10) + 'T12:00:00')) / DAY);
  let tone = '', msg = '';
  if(s.pending_payment) { tone = 'info'; msg = 'Aguardando a confirmação do pagamento. Assim que o pagamento for confirmado, o painel é liberado automaticamente.'; }
  else if(s.blocked) { tone = 'bad'; msg = 'Acesso bloqueado. Os cartões dos clientes não estão carimbando. Fale com o suporte para reativar.'; }
  else if(d < -((s.cancelled_at || (s.is_trial && !s.asaas_subscription_id)) ? 0 : 10)) { tone = 'bad'; msg = 'Seu plano venceu e os carimbos estão pausados. Renove para voltar a carimbar.'; }
  else if(d < 0) { tone = 'warn'; msg = 'Seu plano venceu. Pague em até ' + (10 + d) + ' ' + pl(10 + d, 'dia', 'dias') + ' para não pausar os carimbos.'; }
  else if(s.is_trial) { tone = 'info'; msg = 'Período de teste: termina em ' + d + ' ' + pl(d, 'dia', 'dias') + ' (' + new Date(s.renews_at + 'T12:00:00').toLocaleDateString('pt-BR') + ').' + (s.asaas_subscription_id ? ' Assinatura criada: 1ª cobrança nessa data.' : ' <a class="btn small" href="comprar.html?upgrade=1" style="margin-left:8px;text-decoration:none;display:inline-block">Comprar o kit</a>'); }
  else if(d <= 7) { tone = 'info'; msg = 'Seu plano renova em ' + d + ' ' + pl(d, 'dia', 'dias') + ' (' + new Date(s.renews_at + 'T12:00:00').toLocaleDateString('pt-BR') + ').'; }
  return msg ? `<div class="pbanner ${tone}">${msg}</div>` : '';
}


/* ---------- Tum: assistente pessoal da loja ---------- */
const TUM = { msgs:[], busy:false, open:false, built:false };
const TUM_CHIPS = ['Resumo do mês','Qual dia é mais cheio?','Quem mais volta?','Clientes sumidos há 30 dias','Que prêmio devo dar?','Como configuro o NFC Tools?'];
function tumFmt(t){
  const lines = esc(t).split('\n'); let out = '', ul = false;
  for(const l of lines){
    const b = l.match(/^\s*[-*•]\s+(.*)$/);
    if(b){ if(!ul){ out += '<ul>'; ul = true; } out += '<li>' + b[1] + '</li>'; continue; }
    if(ul){ out += '</ul>'; ul = false; }
    out += (l.trim() ? l : '<br>') + (l.trim() ? '<br>' : '');
  }
  if(ul) out += '</ul>';
  return out.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(<br>)+$/,'');
}
function tumBuild(){
  const el = document.createElement('div'); el.id = 'tum';
  el.innerHTML = `<button class="tbtn" id="tumopen" type="button" aria-label="Abrir o Tum, assistente da loja"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7.1L3.5 20.5l1.4-5A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>Tum</button>
  <section class="tpanel" role="dialog" aria-label="Tum, assistente da loja">

    <div class="tmsgs" id="tummsgs" aria-live="polite"></div><div class="chips" id="tumchips"></div>
    <form id="tumform"><textarea id="tumin" rows="1" maxlength="1000" placeholder="Pergunte sobre a sua loja…" aria-label="Pergunta para o Tum"></textarea><button id="tumsend" type="submit">Enviar</button></form>
  </section>`;
  document.body.appendChild(el);
  $('#tumopen').onclick = () => tumToggle(true);
  $('#tumclose').onclick = () => tumToggle(false);
  $('#tumhelp').onclick = () => { tumToggle(false); S.modal = {type:'help'}; render(); setTimeout(() => { const t = $('#mm'); if(t) t.focus(); }, 30); };
  $('#tumnew').onclick = () => { if(TUM.busy) return; TUM.msgs = []; tumDraw(); };
  $('#tumform').onsubmit = e => { e.preventDefault(); tumAsk($('#tumin').value); };
  $('#tumin').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); tumAsk($('#tumin').value); } };
  $('#tumchips').onclick = e => { const b = e.target.closest('button'); if(b) tumAsk(b.textContent); };
  $('#tummsgs').onclick = async e => {
    const b = e.target.closest('.cp'); if(!b) return;

    try { await navigator.clipboard.writeText(txt); b.textContent = 'Copiado ✓'; } catch(_){ toast('Não deu para copiar. Selecione o texto.', true); }
  };
  TUM.built = true; tumDraw();
}

  TUM.open = o; $('#tum').classList.toggle('open', o);

async function tumAsk(q){
  q = (q || '').trim(); if(!q || TUM.busy) return;
  $('#tumin').value = ''; TUM.msgs.push({role:'user', content:q}); TUM.busy = true; tumDraw();
  let reply = '', err = false;
  try {
    const hist = TUM.msgs.filter(m => !m.err).slice(-12).map(m => ({role:m.role, content:m.content}));
    const r = await sb.functions.invoke('tum-chat', {body:{messages:hist}});
    let code = r.data && r.data.error;
    if(!code && r.error && r.error.context && r.error.context.json){ try { code = (await r.error.context.json()).error; } catch(_){} }
    if(code === 'tum_nao_configurado') { reply = 'O Tum ainda está sendo ligado por aqui. Tente de novo daqui a pouco.'; err = true; }
    else if(code === 'nao_autenticado') { reply = 'Sua sessão expirou. Entre de novo no painel.'; err = true; }
    else if(code || r.error || !r.data || !r.data.reply) { reply = 'Não consegui responder agora. Tente de novo em instantes.'; err = true; }
    else reply = r.data.reply;
  } catch(e){ reply = 'Sem conexão com o Tum agora. Confira a internet e tente de novo.'; err = true; }
  TUM.msgs.push({role:'assistant', content:reply, err}); TUM.busy = false; tumDraw();
}
function tumSync(){
  const on = !!(S.user && S.store);
  if(on && !TUM.built) tumBuild();
  const el = $('#tum'); if(!el) return;
  el.style.display = on ? '' : 'none';
  if(!on){ TUM.msgs = []; TUM.open = false; el.classList.remove('open'); tumDraw(); }
}

function drawChart(){
  const el = document.getElementById('chart'); if(!el || !S.stats) return;
  const {kind, range} = S.chart;
  const rows = (range === 'dias' ? S.stats.daily : S.stats.monthly) || [];
  const vals = rows.map(r => +r[kind] || 0);
  const labels = rows.map(r => range === 'dias' ? r.d.slice(8, 10) + '/' + r.d.slice(5, 7) : MES[+r.m.slice(5, 7) - 1]);
  const full = rows.map(r => range === 'dias'
    ? new Date(r.d + 'T12:00:00').toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'})
    : MES[+r.m.slice(5, 7) - 1] + ' de ' + r.m.slice(0, 4));
  const noun = {signups:['novo cliente','novos clientes'], stamps:['carimbo','carimbos'], redeems:['resgate','resgates']}[kind];
  const total = vals.reduce((a, b) => a + b, 0);
  $('#csum').innerHTML = `<b>${total}</b> ${pl(total, noun[0], noun[1])} nos últimos ${range === 'dias' ? '14 dias' : '6 meses'}`;
  const W = Math.max(280, el.clientWidth), H = W < 520 ? 230 : 330, pl_ = 34, pr = 6, pt = 34, pb = 34;
  const max = niceMax(Math.max(0, ...vals)), iw = W - pl_ - pr, ih = H - pt - pb, bw = iw / Math.max(1, vals.length);
  const barW = Math.min(48, bw * .62), every = Math.max(1, Math.ceil(40 / bw));
  let g = '';
  [0, .25, .5, .75, 1].forEach(f => { const y = pt + ih - f * ih;
    g += `<line x1="${pl_}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#E4D9C0" stroke-dasharray="${f === 0 ? '0' : '3 5'}"/><text x="${pl_ - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#3D4C80">${Math.round(max * f * 10) / 10}</text>`; });
  vals.forEach((v, i) => {
    const cx = pl_ + i * bw + bw / 2, x = cx - barW / 2, h = v / max * ih, y = pt + ih - h, last = i === vals.length - 1, r = Math.min(10, barW / 2);
    g += `<rect x="${x}" y="${pt}" width="${barW}" height="${ih}" rx="${r}" fill="#F1EADB"/>`;
    if(v > 0) g += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h, r * 2)}" rx="${r}" fill="${last ? '#E03A2F' : '#14296B'}"/>`;
    g += `<text x="${cx}" y="${pt - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="${v > 0 ? '#14296B' : '#8A93B5'}">${v}</text>`;
    if((vals.length - 1 - i) % every === 0) g += `<text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${last ? '#14296B' : '#3D4C80'}" font-weight="${last ? 700 : 400}">${labels[i]}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${pl_ + i * bw}" y="${pt - 22}" width="${bw}" height="${ih + 22}" fill="transparent"><title>${full[i]}: ${v} ${pl(v, noun[0], noun[1])}</title></rect>`;
  });
  if(!total) g += `<text x="${W / 2}" y="${pt + ih / 2}" text-anchor="middle" font-size="14" fill="#3D4C80">Ainda sem movimento neste período</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico de barras: ${total} ${noun[1]} no período">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  const show = (i) => {
    const cx = pl_ + i * bw + bw / 2, y = pt + ih - vals[i] / max * ih;
    tip.textContent = `${full[i]}: ${vals[i]} ${pl(vals[i], noun[0], noun[1])}`;
    tip.style.left = Math.min(Math.max(cx, 70), W - 70) + 'px'; tip.style.top = Math.max(y - 8, 30) + 'px'; tip.hidden = false;
  };
  el.querySelectorAll('rect.hit').forEach(r => {
    r.addEventListener('pointerenter', () => show(+r.dataset.i));
    r.addEventListener('pointerdown', () => show(+r.dataset.i));
  });
  el.querySelector('svg').addEventListener('pointerleave', () => { tip.hidden = true; });
}

function initials(n){ const p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function avatar(c, size){

function whenShort(d){
  if(!d) return '—';
  const dt = new Date(d), now = new Date(), hm = dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(dt.getFullYear(), dt.getMonth(), dt.getDate())) / DAY);
  if(days <= 0) return 'hoje ' + hm;
  if(days === 1) return 'ontem ' + hm;
  return String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') + ' ' + hm;
}

            <label for="sz" class="szl">Tamanho do símbolo <b id="szv">${+s.stamp_scale || 100}%</b></label><input id="sz" name="sz" type="range" min="50" max="160" step="5" value="${+s.stamp_scale || 100}"></div>
          <div class="rf">
            <label>Símbolo do carimbo</label><input type="hidden" name="ic" value="${esc(s.stamp_icon || 'star')}">
            <div class="picker">${STAMPS.map(([g, list]) => `<div class="pg">${g}</div><div class="pgrid">${list.map(i => `<button type="button" class="pk" data-ic="${esc(i)}" aria-label="${esc(i)}">${i === 'star' ? stampSvg('#14296B').replace('width="100%" height="100%"','width="26" height="26"') : i}</button>`).join('')}</div>`).join('')}</div>
            <div class="cols"><div><label for="bg">Cor do fundo do cartão</label><input id="bg" name="bg" type="color" value="${esc(s.color)}"></div>
            <div><label for="sc">Cor do carimbo</label><input id="sc" name="sc" type="color" value="${esc(s.stamp_color || '#FBF7EE')}"></div></div></div></section>
        <section class="rsec"><div class="rt"><h2>Links no cartão</h2><p>Botões que o cliente vê abaixo dos carimbos. Ligue só os que quiser mostrar.</p></div>
          <div class="rf">
            ${[['whatsapp','uw','WhatsApp','11 99999-9999',s.whatsapp_url ? s.whatsapp_url.replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '') : '',null,false],
               ['instagram','ui','Instagram','@sualoja',s.instagram_url || '','bi',s.bonus_instagram],
               ['facebook','uf','Facebook','facebook.com/sualoja',s.facebook_url || '','bf',s.bonus_facebook],
               ['site','us','Site','sualoja.com.br',s.site_url || '','bs',s.bonus_site],
               ['google','ug','Avaliação no Google','Cole o link de avaliação',s.google_url || '',null,false]].map(([k, n, l, ph, v, bn, bv]) => `<div class="lrow" data-k="${k}">
              <div class="ltop"><b>${l}</b><label class="sw"><span class="swl">No cartão</span><input name="on_${k}" type="checkbox" ${v && !(s.links_off || []).includes(k) ? 'checked' : ''}><i></i></label></div>
              <input id="${n}" name="${n}" type="text" value="${esc(v)}" placeholder="${ph}">
              ${bn ? `<label class="bonus"><input name="${bn}" type="checkbox" ${bv ? 'checked' : ''}><span>🎁 Dar 1 carimbo bônus (1 vez por cliente)</span></label>` : (k === 'google' ? '<small class="nor">Sem carimbo bônus: o Google não permite recompensa por avaliação.</small>' : '')}</div>`).join('')}
            <p class="hint">Não dá para confirmar que a pessoa seguiu: o bônus cai quando ela abre o link e volta ao cartão.</p></div></section>
      </div>
      <div class="savebar"><button class="btn" type="submit">Salvar loja</button></div>
    </form>`;
  return {html, bind(){
    const f = $('#lf');
    const draw = () => {
      f.querySelectorAll('.pk').forEach(b => b.setAttribute('aria-pressed', b.dataset.ic === f.ic.value));
      $('#pv').innerHTML = previewCard(f.ln.value, S.store.stamps_goal, f.ic.value, f.bg.value, f.sc.value, +f.sz.value); $('#szv').textContent = f.sz.value + '%';
    };
    f.querySelectorAll('.pk').forEach(b => b.onclick = () => { f.ic.value = b.dataset.ic; draw(); });
    ['ln', 'bg', 'sc', 'sz'].forEach(n => f[n].oninput = draw); draw();
    const wa = v => { const d = v.replace(/\D/g, ''); if(!d) return v.trim() ? url(v) : null; return 'https://wa.me/' + (d.length <= 11 ? '55' + d : d); };
    const url = (v, ig) => { v = v.trim(); if(!v) return null; if(ig && /^@?[\w.]+$/.test(v)) return 'https://instagram.com/' + v.replace('@', ''); return /^https?:\/\//i.test(v) ? v : 'https://' + v; };
    f.querySelectorAll('.lrow').forEach(r => { const t = r.querySelector('input[type=text]'), sw = r.querySelector('.sw input'); const sync = () => r.classList.toggle('off', !sw.checked); t.oninput = () => { if(t.value.trim() && !t.dataset.had){ sw.checked = true; } t.dataset.had = t.value.trim() ? '1' : ''; sync(); }; t.dataset.had = t.value.trim() ? '1' : ''; sw.onchange = sync; sync(); });
    f.onsubmit = async ev => {
      ev.preventDefault(); const btn = f.querySelector('button[type=submit]');
      const row = {name:f.ln.value.trim(), stamp_icon:f.ic.value, color:f.bg.value, stamp_color:f.sc.value, stamp_scale:+f.sz.value, show_links:true, links_off:['whatsapp','instagram','facebook','site','google'].filter(k => !f['on_' + k].checked && f[{whatsapp:'uw',instagram:'ui',facebook:'uf',site:'us',google:'ug'}[k]].value.trim()), whatsapp_url:wa(f.uw.value),
        instagram_url:url(f.ui.value, true), facebook_url:url(f.uf.value), site_url:url(f.us.value), google_url:url(f.ug.value),
        bonus_instagram:f.bi.checked, bonus_facebook:f.bf.checked, bonus_site:f.bs.checked};
      if(!row.name) return toast('Informe o nome da loja.', true);
      btn.disabled = true; toast('Salvando…');
      const {error} = await sb.from('fid_stores').update(row).eq('id', S.store.id);
      btn.disabled = false;
      if(error) return toast('Erro ao salvar: ' + error.message, true);
      await load(); toast('Loja salva ✓');
    };
  }};
}

/* ---------- Regras ---------- */
function viewRegras(){
  const s = S.store, hasGeo = s.geo_lat != null;
  const html = head('Regras', 'Como o cartão funciona na sua loja') + `
    <form id="rf" class="rform">
      <div class="rbox">
        <section class="rsec"><div class="rt"><h2>Cartão</h2><p>O que o cliente junta e o que ele ganha.</p></div>
          <div class="rf">
            <label for="g">Carimbos para o prêmio</label><input id="g" name="g" type="number" min="2" max="50" value="${s.stamps_goal}">
            <label for="r">Prêmio</label><input id="r" name="r" type="text" value="${esc(s.reward)}"></div></section>
        <section class="rsec"><div class="rt"><h2>Resgate do prêmio</h2><p>O cliente resgata no celular e vai até a loja. O atendente toca em Entregue na aba Retiradas.</p></div>
          <div class="rf">
            <label for="vd">Prazo para retirar depois de resgatar</label><select id="vd" name="vd">${[[1,'1 dia'],[2,'2 dias'],[3,'3 dias'],[7,'1 semana'],[15,'15 dias'],[30,'30 dias']].map(([v, l]) => `<option value="${v}" ${+s.reward_valid_days === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
            <p class="hint">Prêmio não retirado no prazo é perdido.</p></div></section>
        <section class="rsec"><div class="rt"><h2>Frequência</h2><p>Evita carimbos repetidos em sequência.</p></div>
          <div class="rf"><div class="cols">
            <div><label for="cd">Intervalo entre carimbos (min)</label><input id="cd" name="cd" type="number" min="0" value="${s.cooldown_minutes}"></div>
            <div><label for="md">Máx. de carimbos por dia</label><input id="md" name="md" type="number" min="1" max="50" value="${s.max_per_day}"></div></div></div></section>
        <section class="rsec"><div class="rt"><h2>Na loja</h2><p>Só carimba quem está dentro do raio da loja.</p></div>
          <div class="rf">
            <label class="check" style="margin-top:0"><input name="gr" type="checkbox" ${s.geo_required ? 'checked' : ''}> Exigir que o cliente esteja na loja</label>
            <label for="gm">Raio permitido (metros)</label><input id="gm" name="gm" type="number" min="20" max="5000" value="${s.geo_radius_m}">
            <input name="gl" type="hidden" value="${s.geo_lat ?? ''}"><input name="gn" type="hidden" value="${s.geo_lng ?? ''}">
            <button type="button" class="btn line" id="geo" style="margin-top:14px">${hasGeo ? 'Atualizar para o local onde estou' : 'Usar minha localização atual'}</button>
            <p class="hint" id="geost">${hasGeo ? 'Local salvo ✓ (' + (+s.geo_lat).toFixed(5) + ', ' + (+s.geo_lng).toFixed(5) + ')' : 'Local ainda não definido. Estando na loja, toque no botão acima e depois em Salvar regras.'}</p></div></section>
      </div>
      <div class="savebar"><button class="btn" type="submit">Salvar regras</button></div>
    </form>`;
  return {html, bind(){
    $('#geo').onclick = () => {
      const st = $('#geost'); st.textContent = 'Obtendo localização…';
      if(!navigator.geolocation){ st.textContent = 'Este navegador não oferece localização.'; return; }
      navigator.geolocation.getCurrentPosition(p => {
        const f = $('#rf'); f.gl.value = p.coords.latitude; f.gn.value = p.coords.longitude;
        st.textContent = 'Local capturado ✓ (precisão ~' + Math.round(p.coords.accuracy) + ' m). Toque em "Salvar regras".';
      }, () => { st.textContent = 'Não foi possível obter a localização. Permita o acesso no navegador e tente no celular, dentro da loja.'; }, {enableHighAccuracy:true, timeout:15000});
    };
    $('#rf').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target, btn = f.querySelector('button[type=submit]');
      if(f.gr.checked && f.gl.value === ''){ return toast('Para exigir localização, defina o local da loja: estando na loja, toque em "Usar minha localização atual".', true); }
      btn.disabled = true; toast('Salvando…');
      const {error} = await sb.from('fid_stores').update({stamps_goal:+f.g.value, cooldown_minutes:+f.cd.value, reward:f.r.value, 
        max_per_day:+f.md.value, reward_valid_days:+f.vd.value, geo_required:f.gr.checked, geo_radius_m:+f.gm.value,
        geo_lat:f.gl.value === '' ? null : +f.gl.value, geo_lng:f.gn.value === '' ? null : +f.gn.value}).eq('id', S.store.id);
      btn.disabled = false;
      if(error){ toast('Erro ao salvar: ' + error.message, true); return; }
      await load(); toast('Regras salvas ✓');
    };
  }};
}

/* ---------- início ---------- */
async function boot(){
  if(RECOVERY && !S.recovered){ S.recovered = true; await new Promise(r => setTimeout(r, 400)); return viewNewPass(); }
  const {data:{session}} = await sb.auth.getSession();
  S.user = session ? session.user : null;
  const r0 = parseHash(); if(r0) S.view = r0.view === 'cliente' ? 'clientes' : r0.view;
  if(S.user){ await load(); if(r0 && r0.id) await openCustomer(r0.id, true); else syncHash(); } else render();
}
boot();
</script>
</body>
</html>
